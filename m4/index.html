<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>헬퍼손 면접</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffffff">
</head><body>
<style>
/* Layout(헬퍼탐 방식): 상단 로고+탭 내비(PC) / 하단 컬러 칩 탭바(모바일) / 탭마다 색 제목 띠 / 홈은 히어로+리스트 / 단계형은 순차 아코디언 */
/* 확정값: 주색 #1E7BC4, 배경 #EDF0F5, 테두리 #E1E5EC, 그림자, 탭별 컬러 칩, 리스트형 홈, 순차 아코디언. 확인 필요(기본값): 탭 7색, 잉크색, 라운드 값. 탭색은 흰 글자 명암비 확보를 위해 일부 어둡게 조정 */
:root{
  --brand:#1E7BC4; --bg:#EDF0F5; --line:#E1E5EC; --card:#FFFFFF;
  --ink:#18212F; --ink-sub:#5B6675; --signal:#E5484D; --gold:#D9A400;
  --t0:#1A74B8; --t1:#0E7C69; --t2:#6B4BB8; --t3:#B85A0E; --t4:#C23468; --t5:#287A48; --t6:#5E6C80;
  --ok:#1b7f4b; --ok-soft:#e1f3ea; --warn:#8a5000; --warn-soft:#fdf0d9; --bad:#b3261e; --bad-soft:#fbe5e3;
  --r-card:13px; --r-btn:10px; --r-chip:9px; --shadow:0 1px 2px rgba(24,33,47,.04);
  --font:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --tc:var(--t0);
  color-scheme:light;
}
#view{--accent:var(--tc);--accent-soft:color-mix(in srgb,var(--tc) 11%,#fff)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
@media(max-width:640px){body{padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#fff}
.wrap{max-width:1040px;margin:0 auto}
button{font-family:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--tc) 45%,#fff);outline-offset:2px}

/* 상단 */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#fff;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
header.top .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;flex:0 0 34px}
.brand h1{font-size:18px;font-weight:900;margin:0;line-height:1.2}
.brand span{display:block;font-size:13px;color:var(--ink-sub)}
nav#tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav#tabs::-webkit-scrollbar{display:none}
.stop{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 10px;border:0;background:none;border-radius:var(--r-btn);cursor:pointer;color:var(--ink-sub);font-size:14.5px;font-weight:500}
.stop .dot{position:relative;flex:0 0 26px;width:26px;height:26px;border-radius:9px;background:var(--tc);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.stop.active .dot{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--tc)}
.stop.active .lbl{color:var(--tc);font-weight:800}
.stop.has .dot::after{content:"";position:absolute;right:-4px;top:-4px;width:9px;height:9px;border-radius:50%;background:var(--signal);border:2px solid #fff}
.l-short{display:none}
@media(max-width:640px){
  header.top .in{justify-content:flex-start}
  nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);justify-content:space-around;gap:0;overflow:visible;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .stop{flex:1 1 0;flex-direction:column;gap:3px;padding:4px 2px;min-width:0;font-size:12px}
  .l-full{display:none}.l-short{display:inline}
}

/* 본문 */
main{padding-top:16px}
.page-head{background:var(--tc);color:#fff;border-radius:var(--r-card);padding:16px 18px;margin-bottom:14px}
.page-head h2{margin:0 0 4px;font-size:20px;font-weight:800;line-height:1.35}
.page-head p{margin:0;font-size:15px}
.home-top{background:var(--t0);color:#fff;border-radius:14px;padding:18px;margin-bottom:6px}
.home-top h1{font-size:23px;margin:0 0 6px;line-height:1.35;font-weight:800}
.home-top p{margin:0;font-size:15px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stats span{background:rgba(255,255,255,.2);border-radius:8px;padding:3px 10px;font-size:14px;font-weight:700}
@media(max-width:640px){.page-head{padding:13px 14px}.home-top{padding:15px 14px}.home-top h1{font-size:21px}}
.sec{font-size:17px;font-weight:800;margin:20px 0 8px}
.sub{color:var(--ink-sub);font-size:14.5px;margin:0 0 12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;min-width:0;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin:0 0 4px;font-weight:800}
.card h3{margin:0 0 6px;font-size:17px}
.tag{display:inline-block;font-size:12.5px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:6px;margin-bottom:8px}
.q{font-weight:700;margin:0 0 10px;font-size:16px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
dt{color:var(--ink-sub);white-space:nowrap}
dd{margin:0;min-width:0}

/* 리스트형 홈 */
.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow)}
.list li+li{border-top:1px solid var(--line)}
.ri{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;padding:12px 14px;min-height:68px;cursor:pointer}
.ri:hover{background:var(--bg)}
.ri .ic{flex:0 0 40px;height:40px;border-radius:var(--r-chip);background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800}
.ri .mn{flex:1;min-width:0}
.ri b{display:block;font-size:16px}
.ri em{display:block;font-style:normal;font-size:15px}
.ri small{display:block;font-size:13.5px;color:var(--ink-sub)}
.ri svg{flex:0 0 18px;color:var(--ink-sub)}

/* 칩·버튼 */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{font:inherit;font-size:15px;min-height:44px;padding:6px 14px;border-radius:var(--r-chip);border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--tc);border-color:var(--tc);color:#fff;font-weight:700}
.btn{font:inherit;font-size:16px;font-weight:700;min-height:44px;border-radius:var(--r-btn);padding:8px 18px;cursor:pointer;border:1px solid var(--tc);background:var(--tc);color:#fff}
.btn.ghost{background:var(--card);color:var(--tc)}
.btn.text{background:none;border-color:transparent;color:var(--tc);padding:8px 6px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.steps{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:6px 0 0}
.steps i{font-style:normal;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.steps u{text-decoration:none;color:var(--ink-sub);font-size:13px}
.formula{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 10px}
.formula span{flex:1 1 auto;text-align:center;background:var(--accent);color:#fff;font-weight:700;font-size:14px;padding:6px 10px;border-radius:6px;min-width:64px}
.bar{display:flex;height:30px;border-radius:6px;overflow:hidden;font-size:12.5px;font-weight:700;margin:8px 0}
.bar span{display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;line-height:1.2}
.ex{font-size:15px;border-radius:8px;padding:9px 12px;margin-top:8px}
.ex.bad{background:var(--bad-soft)} .ex.good{background:var(--ok-soft)}
.ex b{display:block;font-size:13px;margin-bottom:2px}
.ex.bad b{color:var(--bad)} .ex.good b{color:var(--ok)}
.note{font-size:13.5px;color:var(--ink-sub);margin-top:14px}
.sample{font-size:13.5px;color:var(--ink-sub);margin:4px 0 0}
.split{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:860px){.split{grid-template-columns:1fr 1fr;align-items:start}}
label{display:block;font-size:15px;font-weight:700;margin:12px 0 4px}
label small{font-weight:400;color:var(--ink-sub)}
select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid #C9D1DC;border-radius:var(--r-btn);padding:10px 12px;min-height:48px}
textarea{resize:vertical;min-height:84px}
.draft{background:var(--bg);border:1px dashed #C9D1DC;border-radius:var(--r-btn);padding:14px;font-size:16px;min-height:150px;white-space:pre-wrap}
.draft mark{background:var(--warn-soft);color:var(--warn);border-radius:3px;padding:0 3px}
.meter{font-size:14px;color:var(--ink-sub)}
.timer{font-family:var(--mono);font-size:30px;font-weight:700}
.timer.over{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13.5px;color:var(--ink-sub);font-weight:500}
.tw{overflow-x:auto}

/* 순차 아코디언 */
.prog{display:flex;justify-content:space-between;align-items:center;background:var(--accent-soft);border-radius:var(--r-btn);padding:10px 14px;font-weight:700}
.prog b{color:var(--accent);font-size:19px}
.acc{border:1px solid var(--line);border-radius:var(--r-btn);margin-top:10px;background:var(--card)}
.acc-h{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--ink);font-size:16px}
.acc-h .n{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink-sub);font-weight:800;font-size:14px}
.acc.open .n{background:var(--accent);color:#fff}
.acc.done .n{background:var(--ok);color:#fff}
.acc-h .t{font-weight:700;white-space:nowrap}
.acc-h .sm{margin-left:auto;font-size:13.5px;color:var(--ink-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.acc-b{display:none;padding:0 14px 12px}
.acc.open .acc-b{display:block}
.acc.locked{opacity:.6}
.acc.locked .acc-h{cursor:not-allowed}

/* 평가 */
.score-row{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.score-row:last-of-type{border-bottom:0}
.score-row .h{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.score-row .h em{font-style:normal;font-family:var(--mono);color:var(--accent)}
.score-row p{margin:0;font-size:14.5px;color:var(--ink-sub)}
input[type=range]{width:100%;height:44px;accent-color:var(--tc)}
.total{font-size:46px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.total small{font-size:16px;font-weight:500;color:var(--ink-sub)}
.pill{display:inline-block;font-weight:700;font-size:14.5px;padding:3px 14px;border-radius:999px}
.p90{background:var(--ok-soft);color:var(--ok)} .p80{background:var(--accent-soft);color:var(--accent)} .p70{background:var(--warn-soft);color:var(--warn)} .p0{background:var(--bad-soft);color:var(--bad)}
.band{height:10px;border-radius:5px;background:var(--line);margin:12px 0 6px;overflow:hidden}
.band i{display:block;height:100%;background:var(--tc);width:0;transition:width .2s}
@media(prefers-reduced-motion:reduce){.band i{transition:none}}

.ma{margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
.ma summary{cursor:pointer;font-size:15px;font-weight:700;color:var(--accent);min-height:44px;display:flex;align-items:center}
.fu{font-size:15px;margin-top:8px}.fu b{font-size:13px;color:var(--ink-sub)}.fu ul{margin:2px 0 0;padding-left:18px}
footer{margin-top:24px;border-top:1px solid var(--line);padding-top:14px;font-size:13.5px;color:var(--ink-sub)}
footer p{margin:2px 0}
.ev-emph{font-size:14.5px;background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin:10px 0 0}
input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid #C9D1DC;border-radius:var(--r-btn);padding:10px 12px;min-height:48px}
.stack{display:grid;gap:14px;min-width:0}
.lockmsg{background:var(--bg);border:1px dashed #C9D1DC;border-radius:var(--r-btn);padding:14px;font-size:15px;color:var(--ink-sub)}
.lockmsg b{color:var(--ink)}
.g-h{display:flex;align-items:center;gap:8px;font-size:16px;margin:16px 0 4px}
.gk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--accent);color:#fff;font-weight:800;font-size:13px}
.g-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.g-row:last-child{border-bottom:0}
.g-st{flex:0 0 auto;align-self:flex-start;font-size:12.5px;font-weight:800;padding:2px 9px;border-radius:999px;margin-top:2px}
.g-row.hit .g-st{background:var(--ok-soft);color:var(--ok)}
.g-row.miss .g-st{background:var(--warn-soft);color:var(--warn)}
.g-m{min-width:0;flex:1}.g-m b{display:block;font-size:15.5px}
.g-where{margin:2px 0 0;font-size:13.5px;color:var(--ink-sub)}
.g-eg{margin:4px 0 0;font-size:14.5px;background:var(--accent-soft);border-radius:8px;padding:7px 10px}
.g-sum{display:flex;align-items:baseline;gap:8px;font-size:15px}.g-sum b{font-size:26px;color:var(--accent)}
.jd{margin-top:12px;border:1px solid var(--line);border-radius:var(--r-btn);background:var(--card)}
.jd summary{min-height:48px;display:flex;align-items:center;padding:0 12px;font-weight:700;color:var(--accent);cursor:pointer}
.jd .jb{padding:0 14px 12px;font-size:15px}
.jd h4{margin:12px 0 2px;font-size:13.5px;color:var(--ink-sub);font-weight:700}
.jd ul{margin:0;padding-left:18px}
.cd-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.cd-k{flex:0 0 40px;font-weight:700;font-size:14.5px}
.mb{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.mb i{display:block;height:100%;background:var(--tc)}
.cd-s{flex:0 0 32px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.cd-n{margin:2px 0 0 50px;font-size:13.5px;color:var(--ink-sub)}
.cd-next{margin:8px 0 0;padding-left:20px}
.cd-next li{margin-bottom:4px}
.dl{margin:0 0 8px}.dt{display:inline-block;font-size:12px;font-weight:700;color:var(--tc);background:var(--bg);border-radius:6px;padding:1px 7px;margin-right:6px}
.qs{margin:0 0 6px;font-size:15px}.qs b{color:var(--tc);margin-right:4px}.qs:empty{display:none}
.qpick{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px;margin:8px 0;min-height:44px;font:inherit;color:var(--ink);cursor:pointer}
.qpick[aria-pressed=true]{border-color:var(--tc);box-shadow:0 0 0 1px var(--tc)}
.qpick b{display:block;margin-bottom:6px}.qpick small{display:block;margin-top:6px;color:var(--ink-sub);font-size:13px}

body{word-break:keep-all;overflow-wrap:anywhere}
.chip{min-height:46px;min-width:48px}

@media print{header.top,nav#tabs{display:none}}

/* ===== 헬퍼탐 실제 화면 방식으로 통일 (v20): 파스텔 탭칩·파스텔 제목띠·PC 루트 스테퍼·회청색 외곽선 ===== */
:root{--edge:#8497AE;--line:#D5DCE6;--bg:#F4F6FA;--ink:#2B3545;--ink-sub:#5F6B7D;--tint:#EAF4FC;
  --b0:#E3F0FA;--b1:#DCEFEA;--b2:#E8E4F7;--b3:#F6E8DC;--b4:#F9E1EA;--b5:#DDEFE3;
  --i0:#14578C;--i1:#0B5E4F;--i2:#52399A;--i3:#8A4309;--i4:#9C2552;--i5:#1E6038;--r-card:14px;--tb:var(--b0);--ti:var(--i0)}
body{font-size:16px}
.wrap,header.top .in{max-width:1180px}
header.top{border-bottom:1px solid var(--edge);padding-bottom:0}
.stop .dot{background:var(--tb);color:var(--ti);border-radius:9px}
.stop.active .lbl{color:var(--ti)}
.page-head{background:var(--tb);color:var(--ink);border:1.5px solid var(--edge);padding:16px 20px}
.page-head h2{font-size:22px;font-weight:700;color:var(--ink)}
.page-head p{color:var(--ink-sub)}
.card,.list,.acc,.jd{border:1.5px solid var(--edge)}
.chip,.btn.ghost{border:1.5px solid var(--edge)}
.chip[aria-pressed="true"],.btn{border-color:var(--tc)}
select,textarea,input[type=text]{border:1.5px solid var(--edge)}
.prog{background:var(--tb);color:var(--ink)}.prog b{color:var(--ti)}
@media(min-width:641px){
  header.top{padding-top:10px}
  header.top .in{align-items:flex-start;gap:4px 16px}
  nav#tabs{flex:1 0 100%;order:2;position:relative;overflow:visible;gap:0;margin-top:4px}
  nav#tabs::before{content:"";position:absolute;left:8%;right:8%;top:17px;height:2px;background:#E3E8EF}
  .stop{flex:1 1 0;min-width:0;flex-direction:column;gap:3px;padding:4px 4px 8px;border-radius:0;border-bottom:3px solid transparent;font-size:13.5px;font-weight:600;color:var(--ink);text-align:center}
  .stop .dot{width:28px;height:28px;flex-basis:28px;z-index:1}
  .stop .lbl{white-space:normal;line-height:1.3}
  .stop.active{border-bottom-color:var(--tc)}
}
@media(max-width:640px){nav#tabs{box-shadow:0 -4px 18px rgba(24,33,47,.08);border-top:1px solid var(--edge)}header.top{box-shadow:0 1px 8px rgba(24,33,47,.06)}}
/* v21: 카드 1개짜리 그리드는 전체 폭, 공식 카드는 PC에서 2단 */
.grid>.card:only-child{grid-column:1/-1}
.fl,.fr{min-width:0}
@media(min-width:860px){.fcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px}.fcard .fr{border-left:1px solid var(--line);padding-left:28px}.fcard .fr .ex:first-of-type{margin-top:12px}}
@media(max-width:859px){.fcard .fr{margin-top:12px}}
/* v22: 글자 크기를 헬퍼탐 스케일로 통일 (본문 15px/1.65, 제목 24·20·16, 보조 14·13) */
:root{--font:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif}
body{font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
.brand h1{font-size:16px;font-weight:700}
.page-head h2{font-size:24px}.page-head p{font-size:14px}
.sec{font-size:16px}.sub{font-size:14px}
.card h2,.card h3{font-size:16px}.q{font-size:15px}
dl{font-size:14px}.tag{font-size:13px}
.chip{font-size:14px;font-weight:600}.chip[aria-pressed="true"]{font-weight:700}

const MA={
'경영지원':{인성:['여러 사람의 의견이 충돌했을 때 어떻게 조정했습니까?','교내 행사 준비 중 예산 배분에 이견이 있었습니다. 저는 각 항목의 필요성과 예상 효과를 표로 정리하고 우선순위를 제안했습니다. 그 결과 제한된 예산 내에서 주요 프로그램을 운영할 수 있었습니다.'],직무:['업무 처리 과정에서 오류를 줄이려면 어떻게 하겠습니까?','먼저 오류가 반복되는 업무단계를 파악하겠습니다. 입력 오류와 검토 누락을 구분하고, 반복업무에는 표준양식과 검증 절차를 도입하겠습니다. 이후 오류 발생 건수와 처리시간을 비교해 개선 효과를 확인하겠습니다.'],상황:['중요한 내부자료를 잘못된 수신자에게 이메일로 발송했다면?','즉시 발송 사실과 자료의 민감도를 확인하고 회사의 보안·개인정보 사고 대응절차에 따라 보고하겠습니다. 가능한 회수 및 추가 유출 방지 조치를 신속하게 진행하겠습니다. 이후 발송 전 수신자 검증 절차를 강화하겠습니다.'],PT:['신입사원 조기퇴사 예방을 위한 온보딩 개선방안','이탈 원인 분석 → 입사 초기 적응지원 → 직무교육·멘토링 → 조기이탈률·적응도 관리'],토론:['재택근무 확대는 조직성과 향상에 도움이 되는가?','저는 업무 특성에 따른 선택적 확대가 필요하다고 생각합니다. 집중업무에는 긍정적일 수 있지만 협업과 보안이 중요한 업무에서는 추가 관리가 필요합니다. 따라서 직무별 시범운영 후 성과를 비교하는 방안을 제안합니다.'],AI:['여러 과제를 동시에 수행하면서 우선순위를 정했던 경험은?','학과 행사와 행정업무가 겹쳤을 때 마감일과 중요도를 기준으로 일정을 조정했습니다. 일정표를 공유하고 업무 진행상황을 점검해 주요 업무를 기한 내 완료했습니다.']},
'영업·마케팅':{인성:['목표를 달성하지 못했던 경험은?','SNS 홍보 프로젝트에서 초기 참여율이 예상보다 낮았습니다. 단순히 게시 횟수를 늘리기보다 학생들의 반응을 분석하고 홍보 문구와 게시 시간을 변경했습니다. 이를 통해 고객 반응을 근거로 전략을 수정하는 중요성을 배웠습니다.'],직무:['광고 클릭률은 높은데 구매전환율이 낮다면 어떻게 분석하겠습니까?','광고 메시지와 실제 구매 페이지의 일치 여부를 먼저 확인하겠습니다. 이후 유입 채널, 이탈 구간, 가격·배송조건 등을 비교하고 문제가 의심되는 요소를 A/B 테스트하겠습니다. 단순 클릭 수보다 실제 전환성과를 중심으로 판단하겠습니다.'],상황:['광고비를 상당 부분 사용했는데 실적이 저조하다면?','먼저 광고 성과 데이터를 확인하고 문제가 유입, 전환, 고객 적합성 중 어디에 있는지 분석하겠습니다. 손실 확대를 막기 위해 비효율적인 집행을 조정하고 작은 규모의 개선안을 시험하겠습니다. 이후 성과가 확인된 방안에 예산을 재배분하겠습니다.'],PT:['신규 브랜드의 20대 고객 확보 전략','시장·고객 분석 → 타깃 세분화 → 차별화 메시지 → 채널 운영 → 고객획득비용·전환율 관리'],토론:['기업은 브랜드 인지도와 단기 매출 중 무엇을 우선해야 하는가?','우선순위는 기업의 성장 단계에 따라 달라진다고 생각합니다. 신규 브랜드라면 인지도 확보가 중요하지만, 재무적 여력이 제한적이라면 수익성과 전환성과도 함께 고려해야 합니다.'],AI:['상대방을 설득해 목표를 달성했던 경험은?','학생 대상 프로그램 홍보에서 참여가 저조했습니다. 학생들이 궁금해하는 정보가 무엇인지 확인하고 홍보 내용을 수정했습니다. 이후 문의와 신청 현황을 분석해 효과적인 문구를 지속적으로 개선했습니다.']},
'IT':{인성:['개발 과정에서 팀원과 의견이 달랐던 경험은?','팀 프로젝트에서 개발 방식에 대한 의견이 달랐습니다. 저는 구현 난이도와 유지보수성을 비교하고 간단한 테스트 결과를 공유했습니다. 개인의 선호보다 요구사항과 객관적 근거를 기준으로 의사결정하도록 노력했습니다.'],직무:['API 응답속도가 느려졌을 때 어떻게 해결하겠습니까?','우선 지연이 발생하는 구간과 시점을 확인하겠습니다. 애플리케이션 로그, DB 쿼리, 외부 API 호출시간 등을 분석해 병목 지점을 찾고 개선하겠습니다. 이후 부하테스트를 통해 성능 개선 여부와 부작용을 검증하겠습니다.'],상황:['서비스 배포 직후 장애가 발생했다면?','장애의 영향 범위와 심각도를 확인하고 서비스 피해를 최소화하는 조치를 우선하겠습니다. 배포 변경사항과 로그를 확인해 필요하면 롤백하겠습니다. 복구 이후 원인 분석과 재발 방지 대책을 수립하겠습니다.'],PT:['웹서비스 응답속도 개선방안','성능 현황 분석 → 병목 원인 진단 → DB·캐시·서버 개선 → 부하테스트 및 성능 모니터링'],토론:['신기술 도입과 기존 시스템 안정화 중 무엇을 우선해야 하는가?','저는 서비스 안정성을 우선적으로 확보해야 한다고 생각합니다. 다만 신기술 도입을 중단하기보다는 별도의 시험환경에서 검증하고 안정성이 확보되면 단계적으로 적용하는 방안을 제안합니다.'],AI:['새로운 기술을 학습하고 활용한 경험은?','프로젝트에 필요한 기술을 처음 접했지만 공식 문서와 예제를 학습했습니다. 작은 기능부터 구현하며 오류를 수정했고, 실제 프로젝트에 적용했습니다.']},
'연구개발':{인성:['연구나 실험에 실패했던 경험은?','실험 결과가 예상과 달라 초기 가설을 지지하지 못한 경험이 있습니다. 실험 기록을 검토하고 변수를 다시 구분해 재실험을 진행했습니다. 결과를 억지로 해석하지 않고 원인을 검증하는 태도의 중요성을 배웠습니다.'],직무:['실험결과의 신뢰성을 높이려면 어떻게 해야 합니까?','실험 목적에 맞춰 독립변수와 종속변수를 명확히 설정하겠습니다. 대조군과 반복실험을 활용하고 장비 보정, 실험조건, 원자료를 기록하겠습니다. 결과는 통계적 검토와 재현 가능성을 함께 고려해 해석하겠습니다.'],상황:['마감 직전에 실험 데이터의 오류를 발견했다면?','먼저 데이터 오류가 결과 해석에 미치는 영향을 확인하겠습니다. 신뢰할 수 없는 결과를 그대로 보고하지 않고 담당자에게 상황을 공유하겠습니다. 재실험 가능성과 일정에 미치는 영향을 검토해 검증 가능한 결과와 한계를 명확히 제시하겠습니다.'],PT:['신제품 성능 향상을 위한 연구개발 계획','기술적 한계 분석 → 개선 가설 → 실험설계 → 성능평가 → 양산 가능성 검토'],토론:['연구개발에서는 혁신성과 상용화 가능성 중 무엇이 중요한가?','두 가치 모두 필요하지만 연구개발 단계에 따라 비중이 달라질 수 있습니다. 기초연구에서는 새로운 가능성 탐색을, 제품개발 단계에서는 성능과 사업화 가능성의 검증을 중시하는 것이 합리적입니다.'],AI:['새로운 문제가 발생했을 때 접근하는 방식은?','먼저 문제를 정의하고 확인 가능한 원인 가설을 수립합니다. 가설별로 필요한 데이터를 수집하고 검증한 뒤, 결과에 따라 다음 실험을 결정합니다.']},
'생산·품질':{인성:['꼼꼼함과 책임감을 발휘한 경험은?','실습 중 측정값에 차이가 발생한 것을 발견했습니다. 단순 오차로 넘기지 않고 장비 상태와 측정조건을 확인했습니다. 이후 측정 전 확인사항을 체크리스트로 만들어 동일한 문제의 재발을 줄이고자 했습니다.'],직무:['생산공정의 불량률이 증가했다면 어떻게 분석하겠습니까?','불량 유형과 발생 시점을 먼저 분류하겠습니다. 이후 사람·설비·재료·방법·환경 요인을 검토하고 주요 원인을 가설로 설정하겠습니다. 현장 데이터와 실험으로 원인을 확인한 뒤 개선 전후의 불량률을 비교하겠습니다.'],상황:['납기 직전 제품에서 품질기준 미달이 발견됐다면?','우선 해당 제품의 출하를 보류하거나 격리하는 등 필요한 품질 통제를 실시하겠습니다. 영향 범위와 원인을 확인하고 품질·생산 담당자에게 보고하겠습니다. 적합성이 검증된 이후에만 출하 여부를 결정하겠습니다.'],PT:['제조공정의 불량률 감소방안','불량 현황 파악 → 주요 원인 분석 → 공정조건·검사 개선 → 수율·불량률 평가'],토론:['생산량 확대와 품질 안정화 중 무엇을 우선해야 하는가?','안전과 필수 품질기준은 생산량보다 우선해야 한다고 생각합니다. 품질 안정화 이후에는 공정개선과 설비 효율화를 통해 생산성과 품질을 함께 높이는 방안을 논의할 수 있습니다.'],AI:['업무 중 실수를 발견했을 때 어떻게 대응하겠습니까?','실수가 제품 품질이나 안전에 영향을 미치는지 먼저 확인하겠습니다. 필요하면 즉시 작업을 중단하거나 보고하고, 원인을 파악한 뒤 재발 방지 방법을 마련하겠습니다.']},
'서비스':{인성:['감정적으로 어려운 사람을 응대한 경험은?','아르바이트 중 대기시간이 길어져 불만을 제기하는 고객을 응대한 경험이 있습니다. 먼저 불편을 인정하고 지연 사유와 예상 대기시간을 정확히 안내했습니다. 이 경험을 통해 고객의 감정과 실제 문제를 함께 살펴야 한다는 점을 배웠습니다.'],직무:['고객만족도를 높이기 위한 방법은 무엇입니까?','고객의 불편이 집중되는 접점을 먼저 찾겠습니다. VOC와 고객여정 데이터를 분석하고 대기시간, 응대 정확성, 문제해결 속도 등을 확인하겠습니다. 개선 이후에는 만족도와 재문의율 등을 비교해 효과를 검증하겠습니다.'],상황:['고객이 규정에 없는 보상을 강하게 요구한다면?','고객의 불편을 충분히 듣고 확인 가능한 사실을 파악하겠습니다. 제공 가능한 보상 범위와 규정을 안내하고 현실적인 대안을 제시하겠습니다. 권한을 넘어서는 요청은 책임자에게 연계하되, 고객을 방치하지 않겠습니다.'],PT:['고객 불만 감소 및 재방문율 향상 전략','VOC 분석 → 고객 불편요인 파악 → 응대 프로세스 개선 → 만족도·재방문율 검증'],토론:['고객만족을 위해 서비스 규정을 유연하게 적용해야 하는가?','저는 일정한 유연성은 필요하지만 공정성과 안전을 훼손해서는 안 된다고 생각합니다. 직원의 재량 범위를 명확히 정하고, 예외사항에 대한 승인 절차를 마련하는 것이 바람직합니다.'],AI:['화가 난 고객을 어떻게 응대하겠습니까?','먼저 고객의 불편을 경청하고 공감하겠습니다. 정확한 사실을 확인한 후 해결할 수 있는 범위를 안내하겠습니다. 즉시 해결이 어렵다면 후속 절차와 예상 소요시간을 설명하겠습니다.']}
};

영을 맡으며 일정과 예산을 관리하는 일에 흥미를 느꼈습니다. 이후 컴퓨터활용능력 자격과 회계 기초 과목을 이수했습니다. 입사 후에는 정확한 문서 관리로 팀 업무 지원에 기여하겠습니다.", "다른 직무는 고려하지 않았습니까?"], ["꼼꼼함이 필요한 업무에서 정확도를 높이기 위한 본인만의 방법은?", "방법 소개→적용 사례→결과", "작업 전 점검표를 만들고 제출 전 다른 기준으로 한 번 더 확인합니다. 이 방식으로 학과 장학 서류 40건을 오류 없이 제출했습니다.", "그 방법이 통하지 않았던 적은?"], ["압박감이 큰 상황에서 일을 처리한 경험은?", "상황·압박 요인→대처 행동→결과·배운 점", "발표 전날 자료 수정 요청이 겹쳤을 때 해야 할 일을 시간순으로 나누고 핵심부터 처리했습니다. 발표를 무리 없이 마쳤고 이후 일정에 여유를 두는 습관이 생겼습니다.", "스트레스는 어떻게 관리합니까?"], ["팀에서 본인의 역할은 주로 무엇입니까?", "역할 유형→근거 경험→강점·보완점", "저는 일정과 기록을 관리하는 역할을 주로 맡았습니다. 회의록과 진행표를 공유해 팀 전체가 같은 정보를 보게 했습니다. 다만 의견을 먼저 내는 데는 소극적이어서 회의 전 의견을 미리 정리하는 연습을 하고 있습니다.", "리더 역할 경험은?"]]}, "영업·마케팅": {"인성": [["처음 만난 사람을 설득하거나 관계를 만든 경험은?", "상황→접근 방식(경청·질문)→신뢰 형성→결과", "교내 프로그램 참가자 모집 때 처음 보는 학생들을 직접 만나 필요한 점을 물었습니다. 요구에 맞춰 안내문을 바꾸자 목표 30명을 넘는 38명이 신청했습니다.", "거절당했을 때는?"], ["경쟁 상황에서 성과를 낸 경험은?", "경쟁 구도→차별화 행동→수치 결과→배운 점", "공모전에서 비슷한 아이디어가 많았기에 설문 52건으로 고객 불편을 확인해 차별점을 만들었습니다. 그 결과 우수상을 받았고 근거 기반 접근의 중요성을 배웠습니다.", "경쟁자에게 졌던 경험은?"], ["실패를 겪고 방법을 바꾼 경험은?", "실패 원인 분석→변경한 행동→개선된 결과", "온라인 홍보 게시물 반응이 낮아 조회수와 반응 시간대를 분석했습니다. 게시 시간을 저녁으로 바꾸고 문구를 짧게 줄이자 반응이 2배로 늘었습니다.", "그때 가장 큰 교훈은?"], ["고객(이용자)의 불만을 직접 들은 경험은?", "불만 내용 경청→공감·확인→해결 행동→사후 확인", "카페 아르바이트 중 주문 오류로 불만을 제기한 손님께 먼저 사과하고 내용을 확인한 뒤 다시 제조해 드렸습니다. 이후 주문 복창 습관을 만들어 같은 오류가 줄었습니다.", "손님이 계속 화를 낸다면?"]], "직무": [["고객 이탈이 늘고 있다면 어떤 지표부터 확인하겠습니까?", "이탈 정의→구간별 지표→원인 가설→대응", "먼저 이탈 기준을 정의하고 가입·구매 주기별 재구매율과 이탈 시점을 확인하겠습니다. 이탈 고객의 공통 특징과 불만 유형으로 원인 가설을 세우고 소규모 개선안을 테스트하겠습니다.", "데이터가 부족하다면?"], ["마케팅 캠페인의 성과를 어떻게 측정하겠습니까?", "목표 지표 설정→채널별 추적→비교·분석→개선", "목표를 노출보다 전환 중심으로 정하고 채널별 전환율과 고객 확보 비용을 추적하겠습니다. 캠페인 전후와 대조군을 비교해 효과를 판단하고 낮은 채널은 예산을 조정하겠습니다.", "매출 증가가 캠페인 때문인지 어떻게 압니까?"], ["시장조사는 어떻게 설계하겠습니까?", "목적→대상·표본→방법(설문·인터뷰)→분석", "조사 목적을 먼저 정하고 타깃 고객을 대표하는 표본을 설계하겠습니다. 설문으로 규모를 확인하고 인터뷰로 이유를 보완하겠습니다. 결과는 실행 가능한 개선안으로 정리합니다.", "표본이 작다면?"], ["가격 정책을 변경할 때 고려할 사항은?", "원가·경쟁·고객 민감도→영향 분석→시범 적용", "원가와 경쟁사 가격, 고객 가격 민감도를 함께 보겠습니다. 일부 고객군에 시범 적용해 매출과 이탈률 변화를 확인한 뒤 확대하겠습니다.", "가격을 올려야 하는데 고객이 반발한다면?"]], "상황": [["고객이 약속하지 않은 혜택을 요구한다면?", "요구 확인→가능 범위 설명→대안 제시→내부 보고", "먼저 고객이 기대하는 내용을 정확히 확인하겠습니다. 가능한 범위를 정중히 설명하고 대안을 제시하겠습니다. 권한 밖이면 상사와 협의해 다시 안내하겠습니다.", "계속 요구하며 계약을 취소하겠다고 하면?"], ["월 영업 목표 달성이 어려워 보일 때 어떻게 하겠습니까?", "현황 점검→원인 분석→우선순위 조정→보고", "현재 진행 건과 달성률을 점검해 가능성이 높은 고객에 집중하겠습니다. 부족 원인을 분석해 상사와 공유하고 대응 방안을 협의하겠습니다.", "무리한 판매를 하라고 지시받으면?"], ["팀원이 고객 정보를 개인적으로 사용하는 것을 보았다면?", "사실 확인→위험 인식→보고 절차", "정확한 사실을 확인하고 정보 보호 규정에 위배되는지 확인하겠습니다. 위험이 크다면 즉시 상사나 담당 부서에 보고하겠습니다.", "동료와의 관계가 나빠져도 보고하겠습니까?"], ["신제품 판매 중 제품 결함 가능성을 알게 되었다면?", "판매 보류·확인 요청→고객 안전→보고→대응", "고객 안전을 최우선으로 판단해 관련 부서에 즉시 확인을 요청하겠습니다. 확인 전까지 판매를 보류하도록 요청하고 필요한 안내 방안을 상사와 협의하겠습니다.", "매출 목표가 급하다면?"]], "PT": [["기존 고객의 재구매율을 높이는 전략을 발표하세요.", "현황→고객 세분화→재구매 유도 프로그램→지표", "재구매 시점과 고객군별 구매 패턴을 분석해 이탈 위험 고객을 구분합니다. 구매 후 안내와 맞춤 혜택을 제공하고 재구매율과 고객 생애 가치로 성과를 관리하겠습니다.", "혜택 비용은 감당 가능합니까?"], ["SNS 채널을 활용한 신제품 홍보 계획을 발표하세요.", "목표·타깃→채널·콘텐츠→일정·예산→KPI", "20대 타깃의 이용 채널을 파악해 짧은 영상 중심으로 운영합니다. 4주 일정으로 예고, 출시, 후기 순으로 콘텐츠를 배치하고 도달 수와 전환율을 측정하겠습니다.", "반응이 없으면 어떻게 합니까?"], ["오프라인 매장 방문객을 늘리는 방안을 발표하세요.", "진단→방문 동기 설계→연계 이벤트→효과 측정", "방문 목적과 이탈 지점을 현장 관찰로 확인합니다. 체험 존과 방문 인증 혜택을 도입하고 방문객 수와 구매 전환율로 효과를 평가하겠습니다.", "온라인과 충돌하지 않습니까?"], ["지역 소상공인과의 협업 마케팅 방안을 발표하세요.", "협업 필요성→파트너 선정→공동 프로그램→성과 공유", "지역 고객 접점이 있는 소상공인과 공동 쿠폰과 체험 이벤트를 운영합니다. 상호 고객 유입을 기준으로 성과를 공유하고 다음 협업을 결정하겠습니다.", "수익 배분은?"]], "토론": [["인플루언서 마케팅은 광고 효과가 높은가?", "효과 근거→한계(신뢰·비용)→활용 조건", "도달과 신뢰 형성에 효과적이나 성과 편차가 큽니다. 브랜드와 팔로워 특성이 맞는 경우에 제한적으로 활용하고 성과를 측정하는 조건을 제안합니다.", "광고 표시 문제는?"], ["구독형 서비스 확대는 기업에 유리한가?", "장점(안정 수익)→위험(해지·피로)→조건", "정기 수익 확보에는 유리하지만 가치를 못 느끼면 해지가 빠릅니다. 이용 데이터를 바탕으로 맞춤 혜택을 제공하는 조건에서 유리합니다.", "가격 인상은 어떻게 합니까?"], ["고객 데이터 활용 마케팅과 개인정보 보호 중 무엇이 우선인가?", "가치 비교→법·신뢰 기준→공존 방안", "개인정보 보호는 신뢰의 전제입니다. 동의받은 범위 내에서 최소 정보를 활용하고 투명하게 알리는 조건에서 마케팅을 진행해야 합니다.", "동의율이 낮다면?"], ["신규 고객 확보와 기존 고객 유지 중 어디에 투자할 것인가?", "비용 비교→현황 기준→배분 제안", "일반적으로 신규 확보 비용이 더 크므로 유지에 먼저 투자하되 성장 단계에서는 둘을 병행해야 합니다. 현재 이탈률과 성장 목표를 기준으로 예산을 배분하는 방안을 제안합니다.", "비율은 어떻게 정합니까?"]], "AI": [["본인이 가장 자신 있는 영업·마케팅 역량과 근거는?", "역량→근거 경험→수치 결과→직무 연결", "데이터 기반 기획 능력입니다. 공모전에서 설문 100건을 분석해 핵심 타깃을 좁혔고 최종 제안이 선정되었습니다. 입사 후에도 데이터로 고객을 이해하겠습니다.", "약점은 무엇입니까?"], ["설득이 안 된 경험에서 무엇을 배웠습니까?", "상황→원인→변화→학습", "제안이 거절된 뒤 상대의 우선순위를 충분히 묻지 않았음을 알았습니다. 이후에는 제안 전에 질문 3가지를 준비해 상대 요구부터 확인합니다.", "거절을 어떻게 받아들입니까?"], ["숫자 목표를 달성하기 위해 꾸준히 한 행동은?", "목표→주기적 행동→점검→결과", "학교 행사 홍보 목표 200명을 위해 매일 게시물을 올리고 주 단위로 반응을 점검했습니다. 결과 215명이 참여했습니다.", "목표 미달이면 어떻게 합니까?"], ["이 직무에서 고객을 이해하는 방법은 무엇이라고 생각합니까?", "정의→방법→사례→직무 적용", "고객 데이터와 직접 대화를 함께 활용해야 합니다. 설문으로 규모를 보고 인터뷰로 이유를 이해한 경험이 있습니다. 입사 후에도 같은 방식으로 접근하겠습니다.", "고객의 말과 행동이 다르면?"]]}, "IT": {"인성": [["어려운 기술 문제를 끝까지 해결한 경험은?", "문제 정의→시도한 방법→해결 과정→배운 점", "팀 프로젝트에서 로그인 오류가 간헐적으로 발생했습니다. 로그를 시간순으로 정리해 세션 만료 설정 문제를 찾아 수정했고 오류가 재현되지 않음을 20회 테스트로 확인했습니다.", "해결하지 못했다면 어떻게 했겠습니까?"], ["팀원의 코드나 결과물을 검토하며 의견을 주고받은 경험은?", "검토 기준→피드백 방식→수용·조율→결과", "코드 리뷰에서 변수 이름과 중복 코드를 중심으로 개선 의견을 전달했습니다. 비판이 아닌 제안 형태로 말했고 팀원이 반영해 코드 중복이 줄었습니다.", "의견이 받아들여지지 않으면?"], ["새로운 기술을 짧은 시간에 배워 적용한 경험은?", "학습 계획→학습 방법→적용→결과", "프로젝트에 필요한 React를 2주 동안 공식 문서와 예제로 학습해 화면 3개를 구현했습니다. 학습 내용을 팀 위키에 정리해 공유했습니다.", "어떻게 효율적으로 배웁니까?"], ["일정이 빠듯한 개발 과제에서 우선순위를 정한 경험은?", "요구 정리→핵심 기능 선별→일정 관리→결과", "마감 2주 전 기능이 많아 필수 기능과 선택 기능으로 나눴습니다. 필수 기능을 먼저 완성하고 테스트까지 마쳐 기한 내 제출했습니다.", "줄인 기능은 어떻게 설명했습니까?"]], "직무": [["프로그램에서 오류가 발생했을 때 원인을 찾는 순서는?", "재현→로그 확인→범위 좁히기→수정·검증", "먼저 오류를 재현하고 로그와 입력값을 확인하겠습니다. 최근 변경 사항으로 범위를 좁혀 원인을 찾고 수정 후 같은 조건과 관련 기능을 다시 테스트하겠습니다.", "재현이 안 되면 어떻게 합니까?"], ["좋은 코드란 무엇이라고 생각합니까?", "가독성→유지보수성→테스트 가능성→성능", "다른 사람이 읽고 수정하기 쉬운 코드라고 생각합니다. 명확한 이름과 함수 분리, 테스트 가능한 구조가 기본이고 필요한 경우에 성능을 개선합니다.", "성능과 가독성이 충돌하면?"], ["데이터베이스에서 조회 속도가 느릴 때 어떻게 개선하겠습니까?", "느린 쿼리 확인→인덱스·쿼리 개선→구조 검토→측정", "실행 계획으로 느린 쿼리를 찾고 조건 컬럼에 인덱스를 검토하겠습니다. 불필요한 조회를 줄이고 개선 전후 응답 시간을 비교해 확인하겠습니다.", "인덱스가 많으면 어떤 문제가 있습니까?"], ["웹 서비스의 기본적인 보안 위협에는 무엇이 있고 어떻게 대응합니까?", "위협 유형→방어 기법→점검", "SQL 인젝션과 크로스사이트 스크립팅 같은 입력값 공격이 있습니다. 입력값 검증과 쿼리 매개변수화, 출력 이스케이프로 대응하고 정기적으로 점검하겠습니다.", "비밀번호는 어떻게 저장해야 합니까?"]], "상황": [["배포 직후 서비스 장애가 발생했다면?", "영향 파악→이전 버전 복구→원인 분석→재발 방지", "먼저 영향 범위를 확인하고 필요하면 이전 버전으로 되돌려 서비스를 복구하겠습니다. 이후 원인을 분석하고 결과를 공유해 배포 전 점검 절차를 보완하겠습니다.", "복구보다 원인 파악이 먼저라고 하는 상사에게는?"], ["요구사항이 개발 도중 크게 바뀐다면?", "변경 내용 확인→영향 분석→일정 조정 협의→문서화", "변경 이유와 범위를 확인하고 일정과 기존 기능에 미치는 영향을 분석해 공유하겠습니다. 가능한 범위를 협의하고 합의 내용을 문서로 남기겠습니다.", "일정은 그대로라면?"], ["동료가 작성한 코드에서 보안 취약점을 발견했다면?", "사실 확인→위험도 판단→전달→개선 확인", "취약점 위험도를 확인하고 해당 동료께 근거와 함께 알리겠습니다. 수정 방향을 함께 논의하고 반영 여부를 확인하겠습니다. 위험이 크면 팀에 공유하겠습니다.", "동료가 문제없다고 하면?"], ["모르는 기술이 필요한 업무를 갑자기 맡게 되었다면?", "범위 파악→학습 계획→도움 요청→진행 공유", "필요한 범위를 파악해 핵심부터 학습하고 작은 예제로 먼저 검증하겠습니다. 막히는 부분은 선배께 질문하고 일정에 대한 예상을 상사께 공유하겠습니다.", "기한 내 어렵다면?"]], "PT": [["서비스 응답 속도를 개선하는 방안을 발표하세요.", "현황 측정→병목 원인→개선안→성능 지표", "응답 시간을 단계별로 측정해 병목 구간을 찾겠습니다. 캐시 적용과 쿼리 개선을 우선 실행하고 평균 응답 시간과 오류율을 개선 전후로 비교하겠습니다.", "비용 대비 효과는?"], ["개발 협업 효율을 높이는 도구·프로세스 도입안을 발표하세요.", "문제 진단→도구 선택→적용 단계→성과 지표", "이슈 관리와 코드 리뷰, 자동 테스트를 연결하는 방식을 제안합니다. 단계적으로 도입하고 배포 전 오류 건수와 리뷰 소요 시간으로 효과를 보겠습니다.", "팀이 새 도구를 거부하면?"], ["개인정보를 안전하게 처리하는 시스템 설계 방향을 발표하세요.", "요구사항→설계 원칙→구현 방법→점검", "수집 최소화, 암호화, 접근 권한 분리를 원칙으로 합니다. 로그 기록과 정기 점검으로 운영하고 접근 기록 점검률과 사고 건수를 관리하겠습니다.", "성능 저하는 어떻게 합니까?"], ["신입 개발자 온보딩 자동화 방안을 발표하세요.", "현황→자동화 대상→구현→효과 측정", "환경 설정과 권한 신청에 걸리는 시간을 현황으로 확인합니다. 설치 스크립트와 가이드를 제공하고 첫 커밋까지 걸리는 시간으로 효과를 측정하겠습니다.", "보안은 어떻게 합니까?"]], "토론": [["개발 업무에 생성형 AI 도구 사용을 허용해야 하는가?", "생산성 근거→보안·품질 위험→허용 조건", "생산성 향상에는 도움이 되지만 코드 유출과 품질 문제가 있습니다. 민감 정보 입력 금지와 결과 검토를 조건으로 허용하는 것이 바람직합니다.", "저작권 문제는?"], ["속도 중심 개발과 안정성 중심 개발 중 무엇이 우선인가?", "서비스 성격→위험 비교→조건부 제안", "서비스 특성에 따라 다릅니다. 금융처럼 오류 비용이 큰 서비스는 안정성이 우선이고 초기 서비스는 빠른 검증이 중요합니다. 자동 테스트로 둘을 절충하는 방안을 제안합니다.", "둘 다 요구되면?"], ["오픈소스 활용 확대는 기업에 이익인가?", "비용·속도→라이선스·보안 위험→관리", "개발 속도와 비용 절감에 이익이 있습니다. 라이선스 검토와 취약점 점검을 거치는 조건에서 활용을 확대해야 합니다.", "유지보수 중단 위험은?"], ["원격 협업 개발과 사무실 협업 중 어느 방식이 더 효율적인가?", "비교 기준→장단점→혼합안", "집중 개발에는 원격이, 설계 논의에는 대면이 유리합니다. 업무 단계별로 방식을 구분하는 혼합 운영을 제안합니다.", "신입 교육은 어떻게 합니까?"]], "AI": [["개발 경험에서 본인이 맡은 역할과 기여는?", "프로젝트 소개→역할→기여 수치→배운 점", "4인 팀의 웹 서비스 프로젝트에서 백엔드와 데이터베이스를 맡았습니다. API 12개를 구현하고 조회 쿼리를 개선해 응답 시간을 30% 줄였습니다.", "팀원과 의견이 달랐던 부분은?"], ["문제를 구조화해서 해결한 경험은?", "문제 분해→우선순위→실행→검증", "기능이 복잡해 오류가 잦았던 과제에서 기능을 입력·처리·출력으로 나누어 확인했습니다. 단계별 테스트를 만들어 오류율을 줄였습니다.", "구조화가 어려운 문제는?"], ["코드나 결과를 검증하기 위해 하는 습관은?", "검증 방법→사례→결과", "기능을 만들면 정상·경계·오류 입력 세 가지 테스트를 먼저 확인합니다. 이 방식으로 제출 전 오류 5건을 사전에 찾았습니다.", "테스트를 안 하는 동료가 있다면?"], ["5년 뒤 개발자로서의 목표는?", "목표→필요 역량→단계별 계획→입사 후 기여", "한 영역에서 신뢰받는 전문성을 쌓고 싶습니다. 1~2년 차에는 기본 설계와 테스트 역량을, 이후에는 구조 설계를 학습하겠습니다.", "왜 그 분야입니까?"]]}, "연구개발": {"인성": [["실험이 계획대로 되지 않았을 때 어떻게 대처했습니까?", "실패 확인→원인 가설→재실험→결과·학습", "수업 실험에서 측정값이 이론과 크게 달랐습니다. 장비 보정과 시료 상태를 점검해 오차 원인을 찾았고 재실험으로 오차를 5% 이내로 줄였습니다.", "기한이 촉박했다면?"], ["한 가지 주제를 끈기 있게 탐구한 경험은?", "문제의식→지속 행동→결과→성장", "졸업 연구에서 6개월간 변수를 바꿔 가며 실험하고 기록했습니다. 조건별 결과를 표로 정리해 최적 조건을 찾았습니다.", "중간에 포기하고 싶었던 적은?"], ["연구 내용을 비전문가에게 설명한 경험은?", "대상 파악→쉬운 설명→피드백→개선", "동아리 후배에게 실험 원리를 일상 사례로 비유해 설명했습니다. 이해 여부를 질문으로 확인하며 자료를 고쳤고 후배들이 실험을 스스로 수행했습니다.", "설명이 통하지 않으면?"], ["연구 윤리를 지켜야 했던 경험은?", "상황→윤리 판단→행동→결과", "실험 결과 중 이상값을 제외하자는 의견이 있었습니다. 근거 없는 삭제는 곤란하다고 설명하고 이상값 발생 원인을 확인한 뒤 기록과 함께 보고했습니다.", "팀이 따르지 않으면?"]], "직무": [["가설을 어떻게 세우고 검증하겠습니까?", "문제 정의→가설→실험 설계→통계·판단", "관찰된 문제에서 원인 후보를 정하고 검증할 수 있는 형태로 가설을 세웁니다. 변수를 통제한 실험으로 결과를 얻고 반복 측정과 통계로 판단하겠습니다.", "가설이 틀리면?"], ["실험 결과의 재현성을 확보하는 방법은?", "조건 기록→표준화→반복→교차 확인", "실험 조건과 절차를 상세히 기록하고 표준 절차서로 정리하겠습니다. 같은 조건에서 반복 실험하고 다른 연구자가 재현해 확인하겠습니다.", "재현이 안 되면 어떻게 합니까?"], ["연구 데이터를 관리하는 기본 원칙은?", "원본 보존→명명 규칙→백업→접근 관리", "원본은 수정하지 않고 보존하며 파일명과 날짜 규칙을 통일하겠습니다. 정기적으로 백업하고 접근 권한을 관리하겠습니다.", "데이터 오류를 발견하면?"], ["신제품 개발에서 성능 개선 여부를 어떻게 판단합니까?", "기준 지표→비교 조건→측정 방법→판단", "개선 기준 지표를 먼저 정하고 기존 제품과 같은 조건에서 비교하겠습니다. 반복 측정한 평균과 편차로 개선 여부를 판단하겠습니다.", "일부 지표만 좋아지면?"]], "상황": [["선배 연구자의 실험 결과가 재현되지 않는다면?", "조건 확인→공유→함께 재검증→기록", "먼저 제 실험 조건이 같은지 확인하고 선배께 정중히 공유하겠습니다. 함께 조건을 비교하며 재검증하고 원인과 결과를 기록하겠습니다.", "선배가 맞다고 주장하면?"], ["개발 일정이 지연되고 있는데 품질도 포기할 수 없다면?", "지연 원인→핵심 우선순위→자원 조정→보고", "지연 원인을 파악하고 핵심 기능과 검증 항목을 우선 정하겠습니다. 필요 자원을 요청하고 일정 조정안을 보고해 협의하겠습니다.", "마감이 절대적이라면?"], ["실험 중 안전 규정을 어긴 동료를 보았다면?", "즉시 중지 요청→안전 확보→보고→재발 방지", "위험하면 즉시 작업 중단을 요청하고 안전을 확보하겠습니다. 이후 책임자에게 상황을 공유하고 안전 교육을 보완하자고 제안하겠습니다.", "동료가 괜찮다고 하면?"], ["연구 결과가 기대와 반대로 나왔다면?", "결과 검증→원인 분석→해석→공유", "측정과 계산 오류가 없는지 먼저 확인하고 조건과 변수를 다시 점검하겠습니다. 결과가 맞다면 가설을 수정해 의미를 정리하고 팀과 공유하겠습니다.", "상사가 결과를 바꾸라고 하면?"]], "PT": [["제품 성능을 10% 개선하는 연구 계획을 발표하세요.", "현황·목표→개선 후보→실험 계획→평가", "현재 성능의 한계 요인을 분석해 개선 후보 3가지를 선정합니다. 실험 순서와 평가 지표를 정하고 반복 측정으로 개선율을 확인하겠습니다.", "기간은 얼마나 걸립니까?"], ["신소재(신기술) 도입 타당성을 검토하는 방안을 발표하세요.", "필요성→비교 기준→검증 실험→의사결정", "성능, 비용, 안정성, 공급 가능성을 기준으로 기존 소재와 비교합니다. 시제품 시험으로 검증하고 결과에 따라 도입 여부를 결정하겠습니다.", "위험은 무엇입니까?"], ["연구 개발 과정에서 지식재산을 보호하는 방안을 발표하세요.", "보호 대상→관리 절차→출원 전략→점검", "연구노트를 날짜와 서명으로 기록하고 외부 공개 전 검토합니다. 핵심 기술은 특허 출원을 검토하겠습니다.", "공동 연구는 어떻게 합니까?"], ["연구 실패 사례를 조직 학습으로 연결하는 방안을 발표하세요.", "실패 기록→분석→공유 체계→활용", "실패 원인을 표준 양식으로 기록하고 월 1회 공유회를 운영합니다. 같은 실패의 재발 건수로 효과를 관리하겠습니다.", "책임 추궁 우려는?"]], "토론": [["기초 연구와 응용 연구 중 어디에 투자를 늘려야 하는가?", "장기·단기 효과→위험 비교→포트폴리오", "단기 성과는 응용 연구에서, 장기 경쟁력은 기초 연구에서 나옵니다. 기업 상황에 따라 비율을 정해 병행하는 방안을 제안합니다.", "성과 평가는 어떻게 합니까?"], ["연구 성과 평가에서 논문과 특허 중 무엇이 더 중요한가?", "기업 목적→평가 기준→균형안", "기업 연구는 사업화 가능성이 중요하므로 특허와 제품 기여를 중시하되 논문은 기술 신뢰성 확보에 활용합니다. 두 지표를 함께 평가하는 방식을 제안합니다.", "기초 연구자는?"], ["연구 데이터 공개 확대에 찬성하는가?", "재현성·협력 효과→보안·경쟁 위험→선별 공개", "재현성과 협업에는 도움이 되지만 영업 비밀 위험이 있습니다. 비민감 데이터를 중심으로 단계적으로 공개하는 조건에 찬성합니다.", "공개 기준은 누가 정합니까?"], ["연구개발에서 실패에 대한 관용 문화는 필요한가?", "필요성→한계→운영 조건", "도전적 연구에는 실패 관용이 필요합니다. 다만 같은 실패의 반복은 막도록 기록과 학습 절차를 조건으로 합니다.", "성과 압박은 어떻게 합니까?"]], "AI": [["연구 활동에서 본인이 기여한 부분과 성과는?", "연구 소개→본인 역할→성과 수치→배운 점", "졸업 연구에서 실험 설계와 데이터 분석을 맡았습니다. 반복 실험 30회로 최적 조건을 찾아 측정 편차를 8%에서 3%로 줄였습니다.", "팀 내 갈등은 없었습니까?"], ["연구 직무에 필요한 가장 중요한 역량과 본인의 준비는?", "역량→준비 행동→결과", "가설 검증 역량이 가장 중요합니다. 수업 과제에서 가설을 세워 실험하고 통계 검정으로 결론을 낸 경험이 있습니다.", "부족한 역량은 무엇입니까?"], ["꼼꼼히 기록하고 정리하는 습관은?", "습관 소개→사례→효과", "실험마다 조건과 결과를 같은 양식으로 기록합니다. 덕분에 이전 결과를 비교해 오류 원인을 빠르게 찾았습니다.", "기록이 번거롭지 않습니까?"], ["입사 후 3년간 연구 목표는?", "단기 학습→중기 기여→성장", "1년 차에는 실험 표준과 장비를 숙련하고 2~3년 차에는 소규모 개선 과제를 주도하겠습니다. 재현성 있는 결과를 만드는 연구원이 되겠습니다.", "왜 이 분야입니까?"]]}, "생산·품질": {"인성": [["원칙이나 안전 수칙을 지키기 위해 노력한 경험은?", "상황→원칙 인식→행동→결과", "실습실에서 보호구 착용 규칙을 지키지 않는 팀원에게 번거로워도 규칙을 지키자고 설명했습니다. 이후 팀 전체가 점검표로 확인했고 실습 중 사고 없이 마쳤습니다.", "선배가 어기면 어떻게 합니까?"], ["반복되는 작업을 꾸준히 해낸 경험은?", "작업 특성→꾸준함 유지 방법→성과", "방학 중 매일 같은 시간에 데이터를 기록하는 과제를 60일간 수행했습니다. 체크리스트와 알림을 활용해 누락 없이 완료했습니다.", "지루함은 어떻게 극복합니까?"], ["팀의 오류를 발견해 개선한 경험은?", "오류 발견→원인 분석→개선→결과", "조립 실습에서 같은 단계 오류가 반복되었습니다. 작업 순서를 사진으로 정리해 공유하자 오류가 절반으로 줄었습니다.", "반발이 있었다면?"], ["야간·교대 등 불규칙한 근무에 적응할 수 있었던 경험은?", "상황→관리 방법→결과", "야간 아르바이트를 6개월 하며 수면과 식사 시간을 일정하게 관리했습니다. 결근 없이 근무했습니다.", "건강 관리는 어떻게 합니까?"]], "직무": [["불량률이 갑자기 증가했다면 어떻게 원인을 찾겠습니까?", "데이터 확인→공정 구간 분리→원인 분석(4M)→대책", "시점과 설비, 작업자, 자재별로 불량 데이터를 나눠 보겠습니다. 사람·설비·자재·방법 관점에서 원인을 찾아 조치하고 불량률 변화를 확인하겠습니다.", "원인이 여러 개면?"], ["표준작업서가 왜 필요하며 어떻게 만들겠습니까?", "필요성→작성 방법→교육→개정", "작업자 간 편차를 줄이고 품질을 안정시키기 위해 필요합니다. 현장 작업을 관찰해 순서와 핵심 포인트를 정리하고 교육 후 개선 의견으로 개정하겠습니다.", "작업자가 따르지 않으면?"], ["설비 가동률을 높이는 방법은?", "정지 원인 분석→예방 정비→표준화→측정", "정지 시간을 원인별로 기록하고 빈도가 높은 항목부터 개선하겠습니다. 예방 점검 주기를 정하고 가동률 변화를 관리하겠습니다.", "정비 비용은 어떻게 합니까?"], ["공정에서 안전사고를 예방하는 방법은?", "위험 요소 파악→수칙·교육→점검→사례 공유", "작업별 위험 요소를 찾아 수칙을 정하고 정기 교육과 점검을 하겠습니다. 아차 사고도 기록해 공유하겠습니다.", "생산 압박이 클 때는?"]], "상황": [["생산 중 안전상 위험한 상황을 발견했다면?", "즉시 중지→인원 안전→보고→재발 방지", "우선 작업을 멈추고 인원을 안전하게 대피시키겠습니다. 책임자에게 즉시 보고하고 원인을 확인한 뒤 재개 조건을 정하겠습니다.", "납기가 급하면?"], ["납품 직전 제품에서 품질 이상을 발견했다면?", "격리→범위 확인→보고→고객 안내", "해당 제품을 격리하고 범위와 원인을 확인하겠습니다. 상사와 협의해 고객에게 사실과 일정 변경을 안내하겠습니다.", "납기를 맞추라는 지시가 있으면?"], ["선임의 작업 방식이 표준과 달랐다면?", "표준 확인→정중한 질문→근거 공유→보고", "먼저 제가 표준을 맞게 알고 있는지 확인하겠습니다. 이후 정중히 질문하고 차이가 품질에 영향을 준다면 상사께 보고하겠습니다.", "선임이 불쾌해하면?"], ["설비가 갑자기 멈췄다면?", "안전 확보→원인 확인→담당 요청→기록", "먼저 안전을 확보하고 정지 상황과 알람을 기록하겠습니다. 정비 담당에게 요청하고 임시 대응이 가능한지 확인하겠습니다. 복구 후 원인을 기록하겠습니다.", "혼자 수리할 수 있다면?"]], "PT": [["불량률을 30% 줄이는 개선안을 발표하세요.", "현황→주요 불량→개선과제→지표", "불량 유형을 파레토 차트로 정리해 상위 원인에 집중합니다. 표준 작업과 검사 포인트를 개선하고 월별 불량률로 성과를 관리하겠습니다.", "투자비는 얼마나 듭니까?"], ["작업 현장의 안전 문화를 정착시키는 방안을 발표하세요.", "현황→참여형 활동→점검→성과", "아차 사고 제출과 안전 점검을 현장 참여로 운영합니다. 우수 사례를 공유하고 사고 건수와 점검 이행률로 평가하겠습니다.", "형식적으로 흐를 위험은?"], ["스마트 팩토리 도입 방안을 발표하세요.", "필요성→단계적 적용→데이터 활용→효과", "설비 데이터를 수집해 이상 징후를 조기에 파악하는 것부터 시작합니다. 한 라인에 시범 적용한 뒤 확대하고 가동률과 불량률로 효과를 보겠습니다.", "현장 반발은?"], ["재고 비용을 줄이는 자재 관리 개선안을 발표하세요.", "현황→재고 분류→관리 기준→성과", "자재를 사용 빈도로 분류해 안전재고 기준을 설정합니다. 발주 시점을 표준화하고 재고 회전율과 결품 건수를 관리하겠습니다.", "결품 위험은?"]], "토론": [["생산 속도와 품질 중 무엇이 우선인가?", "비용·신뢰 비교→기준 제시→절충", "품질 불량은 재작업과 신뢰 하락으로 더 큰 비용이 됩니다. 품질 기준을 지킨 범위에서 속도를 높이는 방향이 바람직합니다.", "납기는 어떻게 합니까?"], ["생산 현장 자동화 확대가 일자리에 도움이 되는가?", "효율·안전 효과→고용 우려→전환 교육", "반복·위험 작업은 자동화가 안전과 품질에 도움이 됩니다. 다만 재교육과 직무 전환 지원이 필요합니다.", "비용은 감당할 수 있습니까?"], ["안전 규정을 강화하면 생산성이 떨어지는가?", "단기 비용→사고 비용→현장 의견", "단기적으로 시간이 늘 수 있으나 사고 비용을 줄입니다. 현장 의견을 반영해 불필요한 절차를 줄이는 조건에서 강화가 바람직합니다.", "현장 반발은?"], ["외주 생산 확대는 품질 관리에 유리한가?", "비용 이점→품질 위험→관리", "비용에는 이점이 있으나 품질 편차 위험이 있습니다. 감사와 검수 기준을 사전에 정하는 조건에서 활용해야 합니다.", "정보 유출은 어떻게 막습니까?"]], "AI": [["정확한 작업을 위해 지켜 온 본인의 습관은?", "습관→적용 사례→결과", "작업 전에 순서를 확인하고 완료 후 점검표를 확인합니다. 실습에서 점검 누락을 막아 재작업이 없었습니다.", "어겼던 적은 없습니까?"], ["데이터를 활용해 문제를 개선한 경험은?", "데이터→분석→개선→결과", "실습 데이터를 엑셀로 정리해 불량이 많은 시간대를 찾았습니다. 해당 시간대 점검을 추가해 불량이 20% 줄었습니다.", "데이터가 틀리면 어떻게 합니까?"], ["팀과 협력해 생산 목표를 달성한 경험은?", "목표→역할 분담→협력→결과", "팀 조립 과제에서 역할을 나누고 중간 점검을 두었습니다. 예정보다 하루 앞서 완료했습니다.", "팀원이 따라오지 못하면?"], ["현장에서 일하기 위한 체력·안전 준비는?", "준비 행동→자격→자세", "산업안전 교육을 이수하고 규칙적인 운동으로 체력을 관리합니다. 안전을 최우선으로 일하겠습니다.", "현장 경험은 있습니까?"]]}, "서비스": {"인성": [["무리한 요구를 하는 사람을 응대한 경험은?", "요구 경청→공감→가능 범위 안내→결과", "아르바이트 중 유효기간이 지난 쿠폰 사용을 요구한 손님께 먼저 불편함에 공감하고 사용 가능한 대안을 안내했습니다. 손님은 대안을 수용했고 이후 재방문하셨습니다.", "계속 우기면 어떻게 합니까?"], ["감정을 조절하며 일한 경험은?", "상황→감정 관리법→행동→결과", "바쁜 시간대에 항의를 받았을 때 잠시 숨을 고르고 먼저 사과와 확인을 했습니다. 이후 상황이 안정되어 응대를 마무리했습니다.", "힘들 때 어떻게 회복합니까?"], ["동료를 도와 팀 성과를 높인 경험은?", "상황→도움 행동→결과", "바쁜 동료의 주문을 나눠 맡아 대기 시간이 줄었습니다. 이후 서로 구역을 조정해 평균 대기 시간이 단축되었습니다.", "내 일도 바쁘다면?"], ["고객에게 감사나 칭찬을 받은 경험은?", "상황→행동 포인트→이유→배운 점", "길을 헤매던 어르신을 목적지까지 안내해 드리고 칭찬을 받았습니다. 상대 입장에서 필요한 도움을 먼저 생각하는 것이 서비스라고 배웠습니다.", "그 경험을 직무에서는 어떻게 쓰겠습니까?"]], "직무": [["서비스 품질을 높이기 위해 가장 중요한 것은?", "고객 기대 파악→표 /* KSA·직무 일치 점검 — 헬퍼탐 직무 검색 규칙(synNorm·synMatch)에 맞춘 판정
   · 공백·기호를 지운 정규화 문자열로 비교 (시간 복잡도 = 시간복잡도)
   · 영문 약어는 완전 일치(토큰)만, 4자 이상 영문은 붙여 쓴 형태까지 허용
   · 한글은 2자 이상만 부분 포함으로 인정, 1글자는 판정하지 않음
   · 직무 동의어 사전(JOB_SYN)으로 '직무 일치'를 확인하고, 다른 직무 용어가 더 많으면 알려 줌 */
const synNorm=s=>String(s||'').toLowerCase().replace(/[\s·・\/\-_.,&()\[\]'"]+/g,'');
const isAsc=s=>/^[a-z0-9]+$/.test(s);
function termHit(tn,toks,term){
  const n=synNorm(term);if(n.length<2)return false;
  if(isAsc(n))return toks.has(n)||(n.length>=4&&tn.includes(n));
  return tn.includes(n)}
function evalKSA(v,R,code,k){
  const W=WSPEC[k]||WSPEC['인성'];
  const raw=stripPh(v.join('\n')),tn=synNorm(raw),toks=new Set(raw.toLowerCase().match(/[a-z0-9]+/g)||[]);
  const has=w=>termHit(tn,toks,w);
  const items=[];['K','S','A'].forEach(c=>R[c].forEach(([label,kw])=>{const w=kw.find(has);items.push({c,label,hit:!!w,word:w||''})}));
  const hit=items.filter(x=>x.hit).length,tot=items.length;
  const plain=v.map(x=>String(x).trim()).filter(Boolean).join(' '),limit=Math.round(W.sec*5.5);
  const checks=[];
  if(W.num!=null)checks.push({ok:/\d/.test(v[W.num]),yes:W.numY,no:W.numN,t:W.num,s:W.numS});
  checks.push({ok:v[W.act].length>=25,yes:W.actY,no:W.actN,t:W.act,s:W.actS});
  if(R.kpi&&W.kpi){const kps=R.kpi.split(/[,，]/).map(s=>s.trim()).filter(Boolean),rt=stripPh(W.kpi.map(i=>v[i]).join(' ')),rn=synNorm(rt),rk=new Set(rt.toLowerCase().match(/[a-z0-9]+/g)||[]);
   const kw=kps.find(x=>kwOf(x).some(w=>termHit(rn,rk,w)));
   checks.push({ok:!!kw,yes:'직무 성과지표와 연결되어 있습니다',no:`‘${W.steps[W.kpiN][0]}’ 단계를 직무 성과지표(${R.kpi})와 연결하세요`,t:W.kpiN,s:W.kpiS(kps[0])})}
  if(W.extra)checks.push(W.extra(v));
  const secTxt=W.sec>=120?`${W.sec/60}분`:`${W.sec}초`;
  checks.push({ok:plain.length<=limit,yes:`분량이 ${secTxt} 안입니다 · ${plain.length}자`,no:`${secTxt}(약 ${limit}자)를 넘습니다 · ${plain.length}자. 가장 약한 문장을 줄이세요`,t:null,s:null});
  let syn=null;
  if(code&&JOB_BY[code]){
   const J=JOB_BY[code],terms=[...(JOB_SYN[code]||'').split(','),...J.n.split('·'),...(J.m||[])].map(x=>x.trim()).filter(Boolean);
   const word=terms.find(has)||'';
   let near=[];
   if(!word){JOBDB.forEach(o=>{if(o.c===code)return;const ts=(JOB_SYN[o.c]||'').split(',').filter(x=>synNorm(x).length>=3);const n=ts.filter(has).length;if(n>=2)near.push([n,o.n])});
    near=near.sort((a,b)=>b[0]-a[0]).slice(0,2).map(x=>x[1])}
   syn={ok:!!word,word,eg:terms.filter(x=>/[가-힣]/.test(x)).slice(0,3),near}}
  return {items,hit,tot,checks,syn,len:plain.length,limit}}
/* 직무·KSA 데이터: 헬퍼탐 '직무 탐색' (직무 대영역 21개 · 직무 107개) 내장. JOBDB, JOBGROUPS는 jobdb.js 참고 */
const JOB_BY={};JOBDB.forEach(j=>{JOB_BY[j.c]=j});
const STOP=new Set(['분석','관리','능력','기초','이해','활용','작성','수립','업무','기반','방법','기법','운영','체계','도구','기본','수행','대응','설계','개발','구조','정리','기준','원리','지식','기술','관련','수준','일반','통해','위한','대한','현장','자료','계획','결과','관점','빠른','수','및','등']);
function kwOf(label){
  const base=String(label).toLowerCase().replace(/\(([^)]*)\)/g,' $1 ').split(/[\s·,，/()\[\]+&\-‧~.:;]+/).filter(w=>w.length>=2&&!/^\d+$/.test(w));
  let w=base.filter(x=>!STOP.has(x));if(!w.length)w=base;
  const out=new Set(w);w.forEach(x=>{if(x.length>=3&&/[성력감심법]$/.test(x))out.add(x.slice(0,-1))});
  return [...out]}
const toItems=a=>(a||[]).map(l=>[l,kwOf(l)]);
const linesToItems=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean).map(l=>[l,kwOf(l)]);

let evType='인성';
function viewScore(){
 const S0=store.get('sc2',{}), S=(S0&&typeof S0==='object'&&!Array.isArray(S0))?S0:{}, KS=TYPES.map(t=>t.k);
 const get=k=>{const o=S[k];return o&&o.v&&o.v.length===RUB[k].items.length?o:{v:RUB[k].items.map(()=>0),done:false,fb:''}};
 const put=(k,o)=>{S[k]=o;store.set('sc2',S)};
 const arm=(b,fn)=>{let t=null;const o=b.textContent;b.onclick=()=>{if(t){clearTimeout(t);t=null;b.textContent=o;fn();return}b.textContent='한 번 더 누르면 초기화';t=setTimeout(()=>{t=null;b.textContent=o},4000)}};
 const sumOf=o=>o.v.reduce((a,b)=>a+b,0);
 const low=(k,o)=>RUB[k].items.map((r,i)=>[o.v[i]/r[2],r[0]]).sort((a,b)=>a[0]-b[0])[0][1];
 const gr=t=>t>=90?['p90','우수']:t>=80?['p80','양호']:t>=70?['p70','보완 필요']:['p0','구조 재설계'];
 function renderSum(){
  const rows=KS.map(x=>{const o=get(x),t=sumOf(o),any=o.done||t>0;return `<tr><td><b>${x}</b></td><td>${any?t+' / 100':'-'}</td><td>${o.done?'완료':(t>0?'작성 중':'미평가')}</td><td>${any?esc(low(x,o)):'-'}</td></tr>`}).join('');
  const dn=KS.filter(x=>get(x).done), avg=dn.length?Math.round(dn.reduce((a,x)=>a+sumOf(get(x)),0)/dn.length):null;
  const weak=dn.length?dn.slice().sort((a,b)=>sumOf(get(a))-sumOf(get(b)))[0]:null;
  $('#sum').innerHTML=`<h2>6개 유형 종합</h2>${avg==null?'<p class="sub">유형별 평가를 완료하면 종합 결과가 나옵니다.</p>':`<div class="g-sum"><b>${avg}</b><span>점 · 완료한 ${dn.length}개 유형 평균</span></div><p>가장 먼저 연습할 유형: <b>${weak}면접</b> (${sumOf(get(weak))}점)</p><div class="row" style="margin-top:0"><button type="button" class="btn ghost" id="gof">답변 공식 보기</button></div>`}
  <div class="tw" style="margin-top:8px"><table><thead><tr><th>유형</th><th>점수</th><th>상태</th><th>보완 1순위</th></tr></thead><tbody>${rows}</tbody></table></div><div class="row"><button type="button" class="btn ghost" id="rsa">6개 유형 전체 초기화</button></div><p class="note">초기화하면 6개 유형의 점수·피드백·완료 표시가 모두 지워집니다. 작성 탭의 답변은 지워지지 않습니다.</p>`;
  if(weak)$('#gof').onclick=()=>go(1);

 function render(){

  <div class="split"><section class="card"><span class="tag">${k}면접</span><h2>${T.n.slice(2)} 평가표</h2><p class="sub">면접관의 핵심 질문 · “${esc(T.q)}”</p>

   <label for="fbk">한 줄 피드백 <small>잘한 점과 보완할 점</small></label><textarea id="fbk" placeholder="예) 행동은 구체적이었으나 결과 수치가 없었음"></textarea>
   <div class="row"><button type="button" class="btn" id="dn">${o.done?'평가 다시 저장':'이 유형 평가 완료'}</button><button type="button" class="btn ghost" id="rs">이 유형 초기화</button><span class="sample" id="msg2" role="status"></span></div>

   <tr><td>70~79점</td><td>경험은 있으나 행동과 결과의 구체성 부족</td></tr><tr><td>70점 미만</td><td>추상적 주장 위주. 답변 구조 재설계 필요</td></tr></tbody></table></div></section>
  <section class="card" id="sum"></section></div></div>
  <p class="note">※ 유형별 평가기준과 배점은 교육용으로 재구성한 예시입니다. PT·토론의 비중 확대는 강의안 지침이며, 세부 배점은 확인 필요. 공식 기업 면접 배점이 아닙니다.</p>`;
  const ins=R.items.map((r,i)=>$('#s'+i));
  const paint=cur=>{cur.v.forEach((x,i)=>$('#v'+i).textContent=`${x} / ${R.items[i][2]}`);const t=sumOf(cur);
   $('#tot').textContent=t;$('#bar').style.width=t+'%';const gp=$('#grade');
   if(t>0){const g=gr(t);gp.className='pill '+g[0];gp.textContent=g[1];$('#low').textContent=`가장 먼저 보완할 항목: ${low(k,cur)}`}else{gp.className='pill';gp.textContent='미평가';$('#low').textContent='슬라이더로 점수를 입력하세요.'}};
  const calc=()=>{const cur=get(k);cur.v=ins.map(x=>+x.value);cur.fb=$('#fbk').value;put(k,cur);paint(cur);renderSum()};
  ins.forEach((x,i)=>{x.value=o.v[i];x.oninput=calc});$('#fbk').value=o.fb||'';$('#fbk').oninput=calc;
  paint(o);renderSum();
  $('#dn').onclick=()=>{const cur=get(k);cur.v=ins.map(x=>+x.value);cur.fb=$('#fbk').value;
   if(sumOf(cur)===0){$('#msg2').textContent='점수를 먼저 입력하세요';return}
   cur.done=true;put(k,cur);const nx=KS.find(x=>!get(x).done);if(nx)evType=nx;render();scrollTo(0,0)};
  arm($('#rs'),()=>{put(k,{v:R.items.map(()=>0),done:false,fb:''});render()});
  $('#evc').onclick=e=>{const b=e.target.closest('button');if(b){evType=b.dataset.k;render()}}}
 render()}

 e.preventDefault();go(i);bs[i].focus()});
markHas();
