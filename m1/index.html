#app{max-width:980px;margin-inline:auto;padding-block:16px 80px}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 240px;min-width:0}
.mute{color:var(--mute);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--sel);color:var(--fg)}
.tag.gold{background:var(--gold);color:#14213D}.tag.ok{background:var(--ok);color:#fff}.tag.warn{background:var(--warn);color:#fff}
.tag.ok,.tag.warn{color:var(--bg)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pick{font:inherit;text-align:left;border:2px solid var(--line);background:var(--input);color:var(--fg);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}

.pick:disabled{cursor:not-allowed;opacity:.55}

.q .qt{font-size:14px;font-weight:700}

.ab button,.q .mc button{font:inherit;font-size:15px;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:10px;cursor:pointer;text-align:left}

.q .mc{display:flex;flex-direction:column;gap:6px}
.bar{display:flex;align-items:center;gap:8px;font-size:14px}
.bar .nm{flex:0 0 112px}.bar .tr{flex:1;height:14px;background:var(--bar2);border-radius:7px;overflow:hidden}
.bar .fl{height:100%;background:var(--bar)}.bar .v{flex:0 0 52px;text-align:right;font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--sel);font-weight:700}
.tw{overflow-x:auto}
pre.prompt{white-space:pre-wrap;word-break:break-word;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:inherit;font-size:14px;line-height:1.55;margin:0;max-height:340px;overflow:auto}
pre.prompt mark{background:var(--gold);color:#14213D;padding:0 3px;border-radius:3px}
.timer{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.timer .tm{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;min-width:84px}
.timer.done .tm{color:var(--warn)}
.steps{display:flex;flex-direction:column;gap:6px;counter-reset:s}
.hint{border-left:4px solid var(--gold);padding:6px 12px;background:var(--sel);border-radius:0 8px 8px 0;font-size:14px}
.sticky-save{font-size:13px;color:var(--mute)}
.rep h3{margin-top:8px}
.rep .sec{border-top:2px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
