<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1 자기 이해</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>:root{--bg:#F5F2EA;--fg:#14213D;--mute:#44506A;--line:#D9D3C3;--card:#FBF9F3;--acc:#14213D;--accfg:#F5F2EA;--gold:#E3A92F;--goldtx:#8A5D00;--ok:#1F6F4A;--warn:#A03A2A;--sel:#E4EAF6;--bar:#14213D;--bar2:#B9C4DB;--input:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1830;--fg:#ECE8DC;--mute:#A9B4CC;--line:#2C3A5E;--card:#17234A;--acc:#E3A92F;--accfg:#14213D;--gold:#E3A92F;--goldtx:#E3A92F;--ok:#6FCF9D;--warn:#FF9B8A;--sel:#22335F;--bar:#E3A92F;--bar2:#2C3A5E;--input:#0F1830;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1830;--fg:#ECE8DC;--mute:#A9B4CC;--line:#2C3A5E;--card:#17234A;--acc:#E3A92F;--accfg:#14213D;--gold:#E3A92F;--goldtx:#E3A92F;--ok:#6FCF9D;--warn:#FF9B8A;--sel:#22335F;--bar:#E3A92F;--bar2:#2C3A5E;--input:#0F1830;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;line-height:1.6;padding-inline:16px;padding-block:0;word-break:keep-all;overflow-wrap:anywhere}
#app{max-width:980px;margin-inline:auto;padding-block:16px 80px}
h1,h2,h3{font-family:'Noto Serif KR',Georgia,serif;line-height:1.3;text-wrap:balance}
h1{font-size:26px;margin:0}h2{font-size:22px;margin:0}h3{font-size:18px;margin:0}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;padding-block:8px 12px}
header .eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;color:var(--goldtx)}
header .sub{color:var(--mute);font-size:14px;margin-top:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:6px;border-bottom:2px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
nav.tabs button[aria-selected=true]{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}
nav.tabs button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-left:6px}
main{display:flex;flex-direction:column;gap:16px;padding-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.dark{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.card.dark .mute{color:var(--accfg);opacity:.85}
.card.locked{opacity:.92}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 240px;min-width:0}
.mute{color:var(--mute);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--sel);color:var(--fg)}
.tag.gold{background:var(--gold);color:#14213D}.tag.ok{background:var(--ok);color:#fff}.tag.warn{background:var(--warn);color:#fff}
.tag.ok,.tag.warn{color:var(--bg)}
button.btn{font:inherit;font-size:15px;font-weight:700;border:1px solid var(--acc);background:var(--acc);color:var(--accfg);padding:9px 16px;border-radius:10px;cursor:pointer}
button.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
button.btn.gold{background:var(--gold);border-color:var(--gold);color:#14213D}
button.btn.sm{font-size:13px;padding:5px 10px}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
textarea,input[type=text],input[type=number],select{width:100%;font:inherit;font-size:15px;background:var(--input);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{resize:vertical;min-height:44px}
textarea:disabled,input:disabled,select:disabled{opacity:.7;background:var(--card)}
.pii-bad{border-color:var(--warn)!important;outline:2px solid var(--warn)}
#pii{display:none;background:var(--warn);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:700;margin-top:8px}
label.lab{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
label.lab span.mute{font-weight:400}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--input);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt:has(input:checked){background:var(--sel);border-color:var(--acc)}
.opt input{margin-top:5px;flex:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pick{font:inherit;text-align:left;border:2px solid var(--line);background:var(--input);color:var(--fg);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.pick b{font-size:15px}.pick span{font-size:13px;color:var(--mute)}
.pick[aria-pressed=true]{border-color:var(--acc);background:var(--sel)}
.pick.top{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.pick:disabled{cursor:not-allowed;opacity:.55}
.q{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--input)}
.q .qt{font-size:14px;font-weight:700}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.ab{grid-template-columns:1fr}}
.ab button,.q .mc button{font:inherit;font-size:15px;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:10px;cursor:pointer;text-align:left}
.ab button[aria-pressed=true],.q .mc button[aria-pressed=true]{border-color:var(--acc);background:var(--sel);font-weight:700}
.q .mc{display:flex;flex-direction:column;gap:6px}
.bar{display:flex;align-items:center;gap:8px;font-size:14px}
.bar .nm{flex:0 0 112px}.bar .tr{flex:1;height:14px;background:var(--bar2);border-radius:7px;overflow:hidden}
.bar .fl{height:100%;background:var(--bar)}.bar .v{flex:0 0 52px;text-align:right;font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--sel);font-weight:700}
.tw{overflow-x:auto}
pre.prompt{white-space:pre-wrap;word-break:break-word;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:inherit;font-size:14px;line-height:1.55;margin:0;max-height:340px;overflow:auto}
pre.prompt mark{background:var(--gold);color:#14213D;padding:0 3px;border-radius:3px}
.timer{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.timer .tm{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;min-width:84px}
.timer.done .tm{color:var(--warn)}
.steps{display:flex;flex-direction:column;gap:6px;counter-reset:s}
.hint{border-left:4px solid var(--gold);padding:6px 12px;background:var(--sel);border-radius:0 8px 8px 0;font-size:14px}
.sticky-save{font-size:13px;color:var(--mute)}
.rep h3{margin-top:8px}
.rep .sec{border-top:2px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.rep .kv{display:grid;grid-template-columns:150px 1fr;gap:8px;font-size:14px}
@media (max-width:560px){.rep .kv{grid-template-columns:1fr;gap:0}.bar .nm{flex-basis:84px}}
.rep .kv b{color:var(--mute)}
details>summary{cursor:pointer;font-weight:700}
@media print{
 body{background:#fff;color:#000;padding:0}
 header.top,nav.tabs,.noprint,#pii{display:none!important}
 #app{max-width:none;padding:0}
 .card{border:1px solid #999;break-inside:avoid;background:#fff}
 main>.card:not(.rep-card){display:none}
 .rep .sec{break-inside:avoid}
 :root{--bg:#fff;--fg:#000;--mute:#333;--line:#999;--card:#fff;--sel:#eee;--input:#fff;--acc:#000;--accfg:#fff;--goldtx:#000;--bar:#000;--bar2:#ccc}
}
p,ul{margin:0}ul{padding-left:20px}
.bad-range{border-color:var(--warn)!important;outline:2px solid var(--warn)}
.num{max-width:110px}
.diff{background:var(--gold);color:#14213D;font-weight:700}
[id^=test-]{scroll-margin-top:72px}
</style>
