const KEY='career_growth_draft';

const app=document.getElementById('app');
const $=id=>document.getElementById(id);
const v=id=>{const e=$(id);return e?e.value:null};
function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function entryText(i){const s=state.star[i]||{};return [s.S,s.T,s.A,s.R].filter(Boolean).join(' ')}
function fail(msg,focusId){const e=$('err');if(e){e.textContent=msg;e.scrollIntoView({behavior:'smooth',block:'center'})}if(focusId&&$(focusId))$(focusId).focus()}

/* ---------- 입력 수집 / 이동 ---------- */
function collect(){
 if(state.step===0){const m=v('major');if(m!==null)state.major=m.trim();const y=v('year');if(y!==null)state.year=y}
 if(state.step===2)state.selected.forEach(i=>{const o={};STAR_KEYS.forEach(([k])=>{const x=v(`st_${k}_${i}`);o[k]=x===null?((state.star[i]||{})[k]||''):x.trim()});state.star[i]=o});
 if(state.step===3)state.selected.forEach(i=>{const x=v('follow'+i);if(x!==null)state.follow[i]=x.trim()});
 if(state.step===5)['sector','job','reason','action'].forEach(k=>{const x=v(k);if(x!==null)state[k]=x.trim()});
}
function advance(n){collect();state.step=n;render();if(n===0){window.scrollTo({top:0,behavior:'smooth'});const h=$('openTitle');if(h)h.focus({preventScroll:true})}else focusOpen()}
function toggleCat(i){const s=state.selected;if(s.includes(i)){state.selected=s.filter(x=>x!==i)}else{if(s.length>=MAX_SEL){return fail(`최대 ${MAX_SEL}개까지 선택할 수 있습니다. 다른 경험을 고르려면 기존 선택을 해제해 주세요.`)}state.selected=[...s,i].sort((a,b)=>a-b)}render();const bt=document.querySelectorAll('.cat')[i];if(bt)bt.focus({preventScroll:true})}
function toFollow(){collect();for(const i of state.selected){if(((state.star[i]||{}).A||'').length<15)return fail(`'${CATS[i][0]}' 경험의 A(행동)를 15자 이상 구체적으로 작성해 주세요.`,`st_A_${i}`)}advance(3)}
function toResult(){collect();for(const i of state.selected){if((state.follow[i]||'').length<10)return fail(`'${CATS[i][0]}' 추가 질문에 10자 이상 답해 주세요.`,'follow'+i)}advance(4)}
function resetAll(){if(!confirm('작성한 내용을 모두 지우고 처음부터 시작할까요?'))return;try{localStorage.removeItem(KEY)}catch(e){}Object.assign(state,fresh());render();window.scrollTo({top:0})}

/* ---------- 분석 로직 ---------- */
function analyze(){
 const sc={},ev={},ex={};FEATURES.forEach(f=>{sc[f.id]=0;ev[f.id]=new Set();ex[f.id]=[]});
 state.selected.forEach(i=>{
  const main=entryText(i).toLowerCase(),fu=(state.follow[i]||'').toLowerCase();
  FEATURES.forEach(f=>{
   const hm=f.keywords.filter(k=>main.includes(k.toLowerCase())),hf=f.keywords.filter(k=>fu.includes(k.toLowerCase()));
   const all=[...new Set([...hm,...hf])];if(!all.length)return;
   sc[f.id]+=Math.min(all.length,4)+(hf.length?1:0); // 경험별 상한 4 + 심화 답변에서 재확인되면 +1
   all.forEach(k=>ev[f.id].add(k));ex[f.id].push(CATS[i][0]);
  });
 });
 FEATURES.forEach(f=>{if(ex[f.id].length>1)sc[f.id]+=(ex[f.id].length-1)*1.5}); // 여러 경험에서 반복되면 가산
 return {sc,ev,ex};
}
function strengths(){const {sc,ev,ex}=analyze();return FEATURES.map(f=>({...f,score:sc[f.id],found:[...ev[f.id]],from:ex[f.id]})).filter(f=>f.score>0).sort((a,b)=>b.score-a.score).slice(0,5)}
function ranked(list){
 const {sc}=analyze(),names=Object.fromEntries(FEATURES.map(f=>[f.id,f.name]));
 return list.map(([name,keys],idx)=>({name,idx,score:keys.reduce((s,k,i)=>s+(sc[k]||0)*(i===0?1.25:1),0),matched:keys.filter(k=>sc[k]>0).sort((a,b)=>sc[b]-sc[a]).map(k=>names[k])}))
  .filter(x=>x.score>0).sort((a,b)=>b.score-a.score||b.matched.length-a.matched.length||a.idx-b.idx).slice(0,5)
  .map((x,i)=>({...x,rank:i+1,reason:'연결된 강점: '+x.matched.slice(0,3).join(' · ')}));
}
function mainQ(i){const t=entryText(i).toLowerCase();let best=null,bh=0;FEATURES.forEach(f=>{const h=f.keywords.filter(k=>t.includes(k.toLowerCase())).length;if(h>bh){bh=h;best=f}});return best?best.question:'그 경험에서 본인이 직접 한 행동, 맡은 역할, 결과를 구체적으로 알려주세요.'}
function gaps(i){const s=state.star[i]||{},g=[];if(!s.S)g.push('상황(S)이 비어 있습니다.');if(!s.T)g.push('내가 맡은 역할·목표(T)가 비어 있습니다.');if(!s.R)g.push('결과(R)가 비어 있습니다.');else if(!/\d/.test(s.R))g.push('결과(R)에 숫자(인원·횟수·% 등)가 없습니다.');return g}

/* ---------- 화면 조각 ---------- */
function exKeywords(ex){const t=(ex.S+ex.T+ex.A+ex.R).toLowerCase();return FEATURES.map(f=>({n:f.name,k:f.keywords.filter(k=>t.includes(k.toLowerCase()))})).filter(x=>x.k.length)}
function starBox(i){const e=STAR_EX[i],kws=exKeywords(e);return `<div class="star"><p class="cap">※ 가상의 예시입니다. 문장을 따라 쓰지 말고 본인의 실제 경험으로 바꿔 쓰세요.</p>${['S','T','A','R'].map((k,n)=>`<div class="row"><span class="tag">${['S 상황','T 과제','A 행동','R 결과'][n]}</span><span class="t">${esc(e[k])}</span></div>`).join('')}<div class="kws">이 예시에서 읽히는 강점: ${kws.map(x=>`<span class="chip">${x.n}</span>`).join('')}</div></div>`}
function badgeHtml(i){const s=state.star[i]||{};return STAR_KEYS.map(([k,l])=>{const ok=k==='A'?(s[k]||'').length>=15:!!s[k];return `<span class="bd ${ok?'ok':''}">${l.split(' (')[0]} ${ok?'✓':'○'}</span>`}).join('')}
function updateBadges(){if(state.step===2)state.selected.forEach(i=>{const e=$('bd'+i);if(e)e.innerHTML=badgeHtml(i)})}
function nav(prev,nextCode,label='다음 단계',dis=false){return `<button type="button" class="btn" onclick="advance(${prev})">← 이전</button><button type="button" class="btn primary" ${dis?'disabled':''} onclick="${nextCode}">${label} →</button>`}
function opts(all,top,cur){const o=n=>`<option ${n===cur?'selected':''}>${esc(n)}</option>`,tn=top.map(x=>x.name);return `<optgroup label="추천 TOP 5">${top.map(x=>o(x.name)).join('')}</optgroup><optgroup label="그 밖의 후보 (직접 선택)">${all.map(x=>x[0]).filter(n=>!tn.includes(n)).map(o).join('')}</optgroup>`}
function rankTag(top,name){const r=top.find(x=>x.name===name);return r?`(추천 ${r.rank}위)`:'(직접 선택)'}
function resultRows(list){return list.map(x=>`<div class="resultrow"><div class="rank">${x.rank}</div><div><h3>${esc(x.name)}</h3><p>${esc(x.reason)}</p></div></div>`).join('')}
function strengthCards(sg){const max=Math.max(...sg.map(s=>s.score));return sg.map(s=>`<div class="scard"><h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p><div class="bar" aria-hidden="true"><b style="width:${Math.max(12,Math.round(s.score/max*100))}%"></b></div><div>${s.found.slice(0,8).map(k=>`<span class="chip soft">${esc(k)}</span>`).join('')}</div><p>근거 경험: ${esc([...new Set(s.from)].join(', '))}</p></div>`).join('')}

/* ---------- 렌더 (순차 아코디언) ---------- */
const TITLES=['나의 기본 정보','경험 선택','경험 구체적으로 작성','경험 깊이 알아보기','강점과 추천 결과','진로 목표 정하기','결과보고서'];
const SVG=p=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICONS=['<path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h13"/>','<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1zM15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/>','<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>','<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 5a3 3 0 0 1 0 6M18 20a6 6 0 0 0-2-4.5"/>','<path d="M9 18h6M10 21h3M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>','<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>'];
const CHECK=SVG('<path d="M5 12l5 5 9-10"/>');
const LOCK=SVG('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>');
function summary(i){switch(i){
 case 0:return esc((state.major||'전공 미입력')+' · '+state.year);
 case 1:return esc(`경험 ${state.selected.length}개: `+state.selected.map(k=>CATS[k][0].split('·')[0]).join(', '));
 case 2:return `STAR ${state.selected.length}개 작성 완료`;
 case 3:return `심화 답변 ${state.selected.filter(k=>state.follow[k]).length}개 완료`;
 case 4:return esc('주요 강점: '+strengths().slice(0,3).map(s=>s.name).join(' · '));
 case 5:return esc(state.sector+' · '+state.job);
 default:return ''}}
function stepBody(){
 const s=state.step;
 if(s===0)return panel(0,'개인정보 없이도 체험할 수 있습니다. 전공은 추천 해석의 참고 정보로만 사용합니다.',`<div class="fields"><div><label for="major">전공·학과 (선택)</label><input id="major" placeholder="예: 산업공학전공" value="${esc(state.major)}"></div><div><label for="year">학년</label><select id="year">${['1학년','2학년','3학년','4학년','졸업생'].map(x=>`<option ${state.year===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="note">실습 중 이름·전화번호·학번은 입력하지 마세요. 입력 내용은 이 브라우저에만 임시 저장되며 외부 서버로 제출하지 않습니다.</div>`,`<span></span><button type="button" class="btn primary" onclick="advance(1)">경험 선택 시작 →</button>`);
 if(s===1){const n=state.selected.length,ok=n>=MIN_SEL;return panel(1,`아래 6가지 경험 중 ${MIN_SEL}~${MAX_SEL}개를 선택해 주세요. 한 분야에 특별한 경험이 없어도 괜찮습니다.`,`<div class="catlist">${CATS.map(([nm,d],i)=>{const on=state.selected.includes(i);return `<button type="button" class="cat ${on?'active':''}" aria-pressed="${on}" onclick="toggleCat(${i})"><span class="ic">${SVG(ICONS[i])}</span><span class="tx"><strong>${nm}</strong><span>${d}</span></span><span class="ck" aria-hidden="true">${on?CHECK:''}</span></button>`}).join('')}</div><p class="help">선택 ${n}개 · 최소 ${MIN_SEL}개, 최대 ${MAX_SEL}개 (3~4개 권장: 많을수록 근거는 풍부해지지만 작성 시간이 늘어납니다)${ok?'':' — 2개 이상 선택하면 다음 단계로 갈 수 있습니다.'}</p>`,nav(0,'advance(2)','다음 단계',!ok))}
 if(s===2)return panel(2,'STAR(상황·과제·행동·결과) 순서로 칸을 채워 주세요. 결과가 화려하지 않아도 좋습니다.',`<div class="guide">행동(A)에 행동 동사와 역량 키워드(분석·설문·기획·협업·조율·개선·관리 등)가 들어갈수록 강점이 정확하게 읽힙니다. 예시는 펼쳐서 참고만 하세요.</div>`+state.selected.map((i,k)=>`<div class="experience"><h3>${CATS[i][0]}</h3><details class="exbox" ${k===0?'open':''}><summary>📌 STAR 작성 예시 ${k===0?'접기/펼치기':'보기'}</summary>${starBox(i)}</details>${STAR_KEYS.map(([key,label,ph])=>`<div class="sfield ${key==='A'?'main':''}"><label for="st_${key}_${i}"><span class="sk">${label.split(' ')[0]}</span>${esc(label.replace(/^\w /,''))}</label><textarea id="st_${key}_${i}" placeholder="${esc(ph)}">${esc((state.star[i]||{})[key]||'')}</textarea></div>`).join('')}<div class="badges" id="bd${i}" aria-live="polite"></div></div>`).join(''),nav(1,'toFollow()','추가 질문 받기'));
 if(s===3)return panel(3,'입력한 표현에 따라 질문이 달라집니다. 실제 행동과 결과를 확인하는 과정입니다.',state.selected.map(i=>{const st=state.star[i]||{},g=gaps(i);return `<div class="experience"><h3>${CATS[i][0]}</h3>${STAR_KEYS.map(([k,l])=>st[k]?`<div class="srow"><b>${l.split(' ')[0]}</b> ${esc(st[k])}</div>`:'').join('')}<div class="qbox"><strong>추가 질문</strong>${esc(mainQ(i))}${g.length?`<p class="help" style="margin-bottom:0">함께 보완하면 좋은 점: ${g.map(esc).join(' ')}</p>`:''}</div><label for="follow${i}" style="margin-top:12px">나의 답변</label><textarea id="follow${i}" placeholder="구체적인 행동과 결과를 작성해 주세요. (10자 이상)">${esc(state.follow[i]||'')}</textarea></div>`}).join(''),nav(2,'toResult()','나의 강점 분석하기'));
 if(s===4){const sg=strengths(),ind=ranked(INDUSTRIES),jobs=ranked(JOBS),has=sg.length>0&&ind.length>0&&jobs.length>0;
  return panel(4,'경험에서 발견된 행동 단서를 바탕으로 강점을 정리하고, 산업과 직무를 각각 최대 5개 추천합니다.',`<div class="note">${has?'여러 경험에서 반복되고 심화 답변에서 다시 확인된 표현일수록 비중이 큽니다. 추천 순위는 공인 적합도 점수가 아니라 탐색의 출발점입니다.':'분석할 구체적 행동 키워드가 부족해 추천을 만들 수 없습니다. 경험 작성으로 돌아가 행동(A)을 "무엇을 어떻게 했는지" 동사 중심으로 보완해 주세요.'}</div>${has?`<h2 style="margin:18px 0 2px;font-size:16px">경험에서 발견한 강점·직업적 특성</h2>${strengthCards(sg)}<div class="results"><div><h2>추천 산업 TOP 5</h2>${resultRows(ind)}</div><div><h2>추천 직무 TOP 5</h2>${resultRows(jobs)}</div></div>${ind.length<5||jobs.length<5?'<p class="help">근거가 확인된 후보만 표시했습니다. 경험을 더 구체적으로 쓰면 후보가 늘어납니다.</p>':''}`:''}`,has?nav(3,'advance(5)','목표 산업·직무 선택'):`<span></span><button type="button" class="btn primary" onclick="advance(2)">← 경험 작성으로 돌아가기</button>`)}
 if(s===5){const top1=ranked(INDUSTRIES),top2=ranked(JOBS);if(!INDUSTRIES.some(x=>x[0]===state.sector))state.sector=top1[0].name;if(!JOBS.some(x=>x[0]===state.job))state.job=top2[0].name;
  return panel(5,'추천 후보는 출발점입니다. 스스로 관심이 생기는 산업과 직무를 고르고(추천 밖의 후보도 선택 가능), 이유를 적어 보세요.',`<div class="fields"><div><label for="sector">목표 산업</label><select id="sector">${opts(INDUSTRIES,top1,state.sector)}</select></div><div><label for="job">목표 직무</label><select id="job">${opts(JOBS,top2,state.job)}</select></div></div><label for="reason">선택한 이유 (선택)</label><textarea id="reason" placeholder="내 경험과 어떤 점이 연결되나요?">${esc(state.reason)}</textarea><label for="action" style="margin-top:12px">30일 이내에 실행할 첫 행동 (선택)</label><textarea id="action" placeholder="예: 해당 직무 채용공고 3개를 읽고 필요한 역량을 정리한다.">${esc(state.action)}</textarea>`,nav(4,'advance(6)','결과보고서 완성'))}
 return panel(6,'결과를 저장하거나 인쇄해 상담에 활용하세요.',reportBody(),`<button type="button" class="btn" onclick="advance(5)">← 목표 수정</button><button type="button" class="btn" onclick="downloadReport()">결과 HTML 저장</button><button type="button" class="btn" onclick="downloadJSON()">입력 데이터 저장</button><button type="button" class="btn primary" onclick="window.print()">인쇄 / PDF 저장</button><span style="flex-basis:100%"></span><button type="button" class="btn text" onclick="advance(4)">추천 다시 보기</button><button type="button" class="btn text" onclick="resetAll()">새로 시작하기</button>`);
}
function reportBody(){const sg=strengths(),ind=ranked(INDUSTRIES),jobs=ranked(JOBS);
 return `<div id="report"><h2>나의 경험 기반 진로탐색 결과보고서</h2><p class="lead">헬퍼손 경험이해 · ${new Date().toLocaleDateString('ko-KR')} · ${esc(state.major||'전공 미입력')} · ${esc(state.year)}</p><h3>1. 내가 정리한 경험 (STAR)</h3>${state.selected.map(i=>{const s=state.star[i]||{};return `<div class="experience"><strong>${CATS[i][0]}</strong>${STAR_KEYS.map(([k,l])=>`<div class="srow"><b>${l.split(' ')[0]} ${['상황','과제','행동','결과'][STAR_KEYS.findIndex(z=>z[0]===k)]}</b> ${esc(s[k]||'(미작성)')}</div>`).join('')}<p class="help">심화 답변: ${esc(state.follow[i]||'없음')}</p></div>`}).join('')}<h3>2. 확인된 강점과 근거 키워드</h3>${sg.map(x=>`<div class="srow"><span class="chip">${esc(x.name)}</span> ${x.found.slice(0,8).map(esc).join(' · ')}</div>`).join('')}<h3>3. 추천 산업 TOP 5</h3>${resultRows(ind)}<h3>4. 추천 직무 TOP 5</h3>${resultRows(jobs)}<div class="statement"><h2>5. 나의 목표 선언문</h2><p>나는 <strong>${esc(state.sector)}</strong> ${rankTag(ind,state.sector)} 산업의 <strong>${esc(state.job)}</strong> ${rankTag(jobs,state.job)} 직무를 목표로 탐색한다.</p><p><b>선택 이유:</b> ${esc(state.reason||'추가 작성 필요')}</p><p><b>30일 실행계획:</b> ${esc(state.action||'추가 작성 필요')}</p></div><div class="note" style="margin-top:16px">본 결과는 경험 서술을 바탕으로 한 규칙 기반 탐색 결과입니다. 표준화된 심리검사 결과나 공식 직무적합도 판정이 아니며, 산업·직무 후보는 교육용 예시 목록입니다.</div></div>`}

/* ---------- 저장 / 내보내기 ---------- */
function panel(i,lead,body,buttons){return `<section class="acc open s${i}" id="open"><div class="acc-h"><span class="n">${i+1}</span><span class="t"><h1 id="openTitle" tabindex="-1">${TITLES[i]}</h1></span></div><div class="acc-body"><p class="lead">${lead}</p>${body}<div class="err" id="err" role="alert"></div><div class="actions no-print">${buttons}</div></div></section>`}
function doneRow(i){return `<button type="button" class="acc acc-h done s${i} no-print" onclick="advance(${i})" aria-label="${i+1}단계 ${TITLES[i]} 수정"><span class="n">${CHECK.replace('width="22" height="22"','width="16" height="16"')}</span><span class="t"><b>${TITLES[i]}</b><i>${summary(i)}</i></span><span class="tr">수정</span></button>`}
function lockedRow(i){return `<div class="acc acc-h lock s${i} no-print" aria-disabled="true"><span class="n">${i+1}</span><span class="t"><b>${TITLES[i]}</b><i>이전 단계를 완료하면 열립니다</i></span>${LOCK}</div>`}
function focusOpen(){const e=$('open');if(!e)return;e.scrollIntoView({behavior:'smooth',block:'start'});const h=$('openTitle');if(h)h.focus({preventScroll:true})}
function stopMeta(i){const s=state;if(i===1&&s.selected.length)return s.selected.length+'개';if(i===5&&s.step>5&&s.job)return '선택';return ''}
function stop(i){const s=state.step,act=i===s,dis=i>s;return `<button type="button" class="stop s${i} ${act?'active':''} ${i<s?'has':''}" ${dis?'disabled':''} ${act?'aria-current="step"':''} onclick="advance(${i})" aria-label="${i+1}단계 ${STEPS[i]}${i<s?' 완료, 수정':act?' 진행 중':' 잠김'}"><span class="dot">${i<s?CHECK.replace('width="22" height="22"','width="15" height="15"'):i+1}</span><span class="lbl">${STEPS[i]}</span><span class="meta">${stopMeta(i)}</span></button>`}
function render(){
 state.selected=[...new Set((state.selected||[]).filter(i=>Number.isInteger(i)&&i>=0&&i<CATS.length))].sort((a,b)=>a-b).slice(0,MAX_SEL);
 if(state.step>=2&&state.selected.length<MIN_SEL)state.step=1;
 if(state.step>=5&&(!strengths().length||!ranked(INDUSTRIES).length||!ranked(JOBS).length))state.step=4;
 $('resetBtn').classList.toggle('hidden',state.step===0);
 const s=state.step,cur=stepBody();
 $('progressPills').innerHTML=`<span class="pill ${s===6?'done':''}"><b>${s+1}</b>/${TITLES.length} 단계</span>`+(state.selected.length?`<span class="pill">경험 <b>${state.selected.length}</b>개</span>`:'');
 $('routeList').innerHTML=TITLES.map((_,i)=>`<li>${stop(i)}</li>`).join('');
 $('mobileBottom').innerHTML=TITLES.map((_,i)=>stop(i)).join('');
 const hero=s===0?`<div class="home-top s0 no-print"><p class="hl">내가 해온 일에서<br>내가 잘할 수 있는 일을 찾다.</p><p class="muted">경험 선택 → STAR 작성 → 심화 질문 → 강점 해석 → 산업·직무 추천 → 목표 선언</p></div>`:'';
 const now=`<div id="accNow" class="no-print"><i>지금 할 일 ${s+1}/${TITLES.length}</i><b>${TITLES[s]}</b></div>`;
 app.innerHTML=hero+now+TITLES.map((_,i)=>i<s?doneRow(i):i===s?cur:lockedRow(i)).join('');
 updateBadges();save();
}

function file(name,content,type){const a=document.createElement('a');const u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),500)}
function downloadJSON(){file('진로탐색_입력결과.json',JSON.stringify({student:{major:state.major,year:state.year},experiences:state.selected.map(i=>({type:CATS[i][0],star:state.star[i],followup:state.follow[i]})),strengths:strengths().map(f=>({name:f.name,keywords:f.found})),industries:ranked(INDUSTRIES).map(x=>({rank:x.rank,name:x.name,reason:x.reason})),jobs:ranked(JOBS).map(x=>({rank:x.rank,name:x.name,reason:x.reason})),goal:{industry:state.sector,job:state.job,reason:state.reason,action:state.action}},null,2),'application/json;charset=utf-8')}
function downloadReport(){const r=$('report').cloneNode(true);r.querySelectorAll('.no-print').forEach(x=>x.remove());file('나의_산업직무_탐색보고서.html','<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>진로탐색 결과</title><style>body{font:15px/1.7 "Malgun Gothic",Arial,sans-serif;max-width:800px;margin:35px auto;color:#172b4d;word-break:keep-all;overflow-wrap:anywhere}h2{border-bottom:2px solid #195bcc;padding-bottom:8px}.experience,.statement{padding:15px;margin:12px 0;background:#f2f6fc;border-radius:9px}.chip{display:inline-block;background:#e8f1ff;padding:4px 10px;border-radius:12px;margin:3px}.resultrow{display:flex;border-bottom:1px solid #ddd;padding:7px;gap:15px}.resultrow h3{margin:0}.resultrow p{margin:0;font-size:12px}.rank{font-weight:bold}.srow{margin:4px 0}.srow b{display:inline-block;min-width:60px;color:#174a9a}.help,.lead,.note{color:#58677a;font-size:13px}</style></head><body>'+r.outerHTML+'</body></html>','text/html;charset=utf-8')}

/* ---------- 초기화 ---------- */
let timer;
app.addEventListener('input',()=>{collect();updateBadges();clearTimeout(timer);timer=setTimeout(save,300)});
window.addEventListener('pagehide',()=>{collect();save()});
try{const sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv&&typeof sv==='object'&&!Array.isArray(sv)){
 Object.assign(state,sv);
 const isObj=o=>o&&typeof o==='object'&&!Array.isArray(o);
 if(!isObj(state.star))state.star={};if(!isObj(state.follow))state.follow={};
 if(isObj(sv.entries)){Object.keys(sv.entries).forEach(k=>{if(!state.star[k])state.star[k]={S:'',T:'',A:String(sv.entries[k]||''),R:''}})} // 이전 버전 임시저장 이전
 delete state.entries;
 Object.keys(state.star).forEach(k=>{const o=state.star[k];state.star[k]=isObj(o)?{S:String(o.S||''),T:String(o.T||''),A:String(o.A||''),R:String(o.R||'')}:{S:'',T:'',A:'',R:''}});
 Object.keys(state.follow).forEach(k=>{state.follow[k]=String(state.follow[k]??'')});
 ['major','year','sector','job','reason','action'].forEach(k=>{if(typeof state[k]!=='string')state[k]=fresh()[k]});
 if(!Array.isArray(state.selected))state.selected=[];
 state.step=Math.min(6,Math.max(0,Math.floor(+state.step)||0));
}}catch(e){}
render();
</script></body></html>
